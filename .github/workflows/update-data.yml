name: Update 13F Data

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules run in UTC. This covers the full 7am-6pm
    # America/New_York window in both EST and EDT; the filing-window job below
    # enforces the exact local-time cutoff.
    - cron: '23 11-23 * * 1-5'
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      repair_amendments:
        description: Rebuild every retained quarter affected by a 13F amendment
        required: false
        default: false
        type: boolean
      filing_quarters:
        description: Filing quarters to inspect for a targeted replay or repair
        required: false
        default: 4
        type: number
      filing_cik:
        description: Exact SEC CIK to force-replay instead of running the broad ingest
        required: false
        default: ''
        type: string

concurrency:
  group: data-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read            # verify the newest Pages environment deployment
  pages: read                  # verify exact generated Pages deployments

env:
  DATA_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data

jobs:
  filing-window:
    runs-on: ubuntu-latest
    outputs:
      run_update: ${{ steps.window.outputs.run_update }}
    steps:
      - name: Check 13F filing update window
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          day=$(TZ=America/New_York date +%u)
          hour=$(TZ=America/New_York date +%H)
          if [ "$day" -ge 1 ] && [ "$day" -le 5 ] && [ "$hour" -ge 7 ] && [ "$hour" -le 18 ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping 13F update outside Monday-Friday 7am-6pm America/New_York"
          fi

  update:
    needs: filing-window
    if: needs.filing-window.outputs.run_update == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    outputs:
      code_sha: ${{ steps.publish_snapshot.outputs.code_sha }}
      release_tag: ${{ steps.publish_snapshot.outputs.release_tag }}
      dataset_id: ${{ steps.publish_snapshot.outputs.dataset_id }}
      site_changed: ${{ steps.publish_snapshot.outputs.site_changed }}
    # GitHub-hosted jobs have a hard six-hour limit.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # A queued push/schedule run should converge the live branch, not
          # spend a full pipeline pass on the event's now-stale SHA.
          ref: main
          # Keep modest history for diagnostics. Publication aborts if main
          # moves, rather than rebasing generated artifacts after validation.
          fetch-depth: 10

      - name: Authenticate to the private data repository
        id: data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest validated private snapshot
        id: restore_snapshot
        env:
          DATA_ARCHIVE_TOKEN: ${{ steps.data-app-token.outputs.token }}
        run: |
          set -euo pipefail
          restore_json=$(
            python scripts/data_snapshot.py pull \
              --repository "$DATA_REPOSITORY" \
              --root "$GITHUB_WORKSPACE" \
              --replace
          )
          echo "$restore_json" | jq -e . >/dev/null
          release_tag=$(jq -er '.release_tag' <<<"$restore_json")
          dataset_id=$(jq -er '.dataset_id' <<<"$restore_json")
          archive_sha256=$(jq -er '.archive_sha256' <<<"$restore_json")
          legacy_snapshot=$(jq -er '
            if (.legacy_snapshot | type) == "boolean"
            then (.legacy_snapshot | tostring)
            else error("legacy_snapshot must be boolean")
            end
          ' <<<"$restore_json")
          if [[ ! "$release_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]] ||
             [[ ! "$dataset_id" =~ ^[0-9a-f]{64}$ ]] ||
             [[ ! "$archive_sha256" =~ ^[0-9a-f]{64}$ ]] ||
             [[ "$legacy_snapshot" != "true" && "$legacy_snapshot" != "false" ]]; then
            echo "::error::Private snapshot returned invalid identity metadata"
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "dataset_id=$dataset_id" >> "$GITHUB_OUTPUT"
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "legacy_snapshot=$legacy_snapshot" >> "$GITHUB_OUTPUT"
          echo "Restored private snapshot $release_tag ($dataset_id)"

      - name: Verify SEC_USER_AGENT secret is configured
        # Fail fast with a clear error if the repo secret wasn't set. Without
        # a valid contact email in the User-Agent, SEC returns 403 on every
        # request and the pipeline silently spins on retries.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. Create it under Settings → Secrets and variables → Actions → 'New repository secret' with a value like 'YourName your.real@email.com'."
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*.*) : ;;  # looks like it contains an email — OK
            *) echo "::error::SEC_USER_AGENT does not look like it contains a valid contact email. SEC requires a real email."; exit 1 ;;
          esac

      - name: Restore nonpublishable SEC cutover checkpoint
        if: steps.restore_snapshot.outputs.legacy_snapshot == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/sec_13f_bulk_rebuild_checkpoint.json
            .cache/sec_13f_bulk_source_state.json
            .cache/sec_13f_bulk_completed_receipt.json
            .cache/sec_13f_bulk_indices/.rebuild-*.sqlite3.partial
            .cache/sec_13f_bulk_indices/index-*.sqlite3
            .cache/sec_13f_bulk_rebuild_checkpoint.accession-discovery.json
            .cache/sec-security-master-rebuild-work/manifest.json
            .cache/sec-security-master-rebuild-work/edgar-exception-batch-*.json
          key: >-
            sec-clean-v1-parser1-${{ runner.os }}-${{ steps.restore_snapshot.outputs.dataset_id }}-${{ steps.restore_snapshot.outputs.code_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sec-clean-v1-parser1-${{ runner.os }}-${{ steps.restore_snapshot.outputs.dataset_id }}-${{ steps.restore_snapshot.outputs.code_sha }}-

      - name: Capture validated baseline before ingestion
        if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
        run: python scripts/incremental_pipeline.py capture

      - name: Run pipeline
        id: pipeline
        if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
        # An inner cooperative timeout sends SIGTERM while enough job time
        # remains to regenerate, validate, and publish the pipeline's durable
        # checkpoint. Unexpected non-zero exits still fail closed. A
        # successful migration-only or explicit single-CIK run intentionally
        # skips the recent-feed pass so the bounded replay keeps the hosted-run
        # budget and cannot broaden a targeted repair.
        # Contract-v1 restores skip this ordinary ingest entirely so the
        # one-time SEC history backfill below receives its full budget.
        timeout-minutes: 240
        env:
          # Read from repo secret — never commit your email to a public repo.
          # Configure at: Settings → Secrets and variables → Actions.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REPAIR_AMENDMENTS: ${{ inputs.repair_amendments || 'false' }}
          FILING_QUARTERS: ${{ inputs.filing_quarters || 4 }}
          FILING_CIK: ${{ inputs.filing_cik || '' }}
        run: |
          set -euo pipefail
          # Ordinary updates process the durable recent-feed queue below.
          # Broad quarterly-index reconciliation runs in overnight maintenance.
          mode=(--migrations-only)
          value_unit_migration_pending=$(
            python -c '
          import pipeline
          state = pipeline.load_state()
          needed = (
              state.get("value_unit_migration_version", 0)
              < pipeline.VALUE_UNIT_MIGRATION_VERSION
          )
          print("true" if needed else "false")
          '
          )
          if [ "$value_unit_migration_pending" = "true" ]; then
            # This is a local, bounded scan of every retained quarter. It
            # applies only exact signature-guarded repairs, rejects any
            # remaining peer/adjacent anomaly, and performs no SEC/API calls.
            python scripts/repair_value_units.py --migrate-policy
          fi
          migration_only=$(
            VALUE_UNIT_MIGRATION_PENDING="$value_unit_migration_pending" python -c '
          import os
          import pipeline
          state = pipeline.load_state()
          needed = (
              os.environ["VALUE_UNIT_MIGRATION_PENDING"] == "true"
              or
              state.get("amendment_reducer_version", 0)
              < pipeline.AMENDMENT_REDUCER_VERSION
              or state.get("security_identity_migration_version", 0)
              < pipeline.SECURITY_IDENTITY_VERSION
          )
          print("true" if needed else "false")
          '
          )
          targeted_cik=false
          if [ -n "$FILING_CIK" ]; then
            if [[ ! "$FILING_CIK" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::filing_cik must be a positive integer CIK"
              exit 1
            fi
            mode=(--cik "$FILING_CIK")
            migration_only=false
            targeted_cik=true
          elif [ "$migration_only" = "true" ]; then
            mode=(--migrations-only)
          elif [ "$REPAIR_AMENDMENTS" = "true" ]; then
            mode=(--repair-amendments)
            if [ "$FILING_QUARTERS" -lt 8 ]; then
              FILING_QUARTERS=8
            fi
          fi
          set +e
          # Leave the step-level guard enough room for the bounded local
          # value-unit preflight above plus the checkpoint kill grace.
          timeout --signal=TERM --kill-after=120s 180m \
            python pipeline.py "${mode[@]}" --quarters "$FILING_QUARTERS" --defer-regeneration
          pipeline_status=$?
          set -e
          if [ "$pipeline_status" -eq 124 ]; then
            echo "::warning::Pipeline reached its cooperative time budget; continuing from its durable checkpoint"
          elif [ "$pipeline_status" -ne 0 ]; then
            exit "$pipeline_status"
          fi
          echo "migration_only=$migration_only" >> "$GITHUB_OUTPUT"
          echo "targeted_cik=$targeted_cik" >> "$GITHUB_OUTPUT"

      - name: Refresh recently accepted 13F filings
        id: recent_filings
        # SEC quarterly company.idx files can lag newly accepted EDGAR filings.
        # This generic current-feed pass catches any recent 13F-HR / 13F-HR/A
        # accession before the registry-backed site data is regenerated. An
        # explicit CIK replay is deliberately kept targeted and skips this pass.
        if: >-
          steps.restore_snapshot.outputs.legacy_snapshot != 'true' &&
          steps.pipeline.outputs.migration_only != 'true' &&
          steps.pipeline.outputs.targeted_cik != 'true'
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RECENT_13F_QUARTERS: ${{ inputs.filing_quarters || 4 }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=120s 15m \
            python scripts/refresh_recent_13f_filings.py
          recent_status=$?
          set -e
          if [ "$recent_status" -eq 124 ]; then
            echo "::warning::Recent-filing refresh reached its cooperative time budget; continuing from its durable checkpoint"
          elif [ "$recent_status" -ne 0 ]; then
            exit "$recent_status"
          fi

      - name: Rebuild SEC-only registry-backed site data after legacy restore
        if: steps.restore_snapshot.outputs.legacy_snapshot == 'true'
        timeout-minutes: 280
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          echo "Legacy snapshot detected; forcing clean SEC-only rebuild"
          python scripts/prepare_sec_cold_workspace.py \
            --root "$GITHUB_WORKSPACE" --discard-derived-stocks
          set +e
          timeout --signal=TERM --kill-after=120s 260m \
            python pipeline.py --regenerate-only --rebuild-security-master --apply-quantity-policy
          clean_status=$?
          set -e
          if [ "$clean_status" -eq 124 ]; then
            echo "::error::Clean SEC rebuild reached its cooperative time budget; the private checkpoint will be saved for the next run"
          fi
          exit "$clean_status"

      - name: Detect reusable SEC cutover work
        id: clean_checkpoint
        if: always() && steps.restore_snapshot.outputs.legacy_snapshot == 'true'
        run: |
          if [ -f .cache/sec_13f_bulk_rebuild_checkpoint.json ] ||
             [ -f .cache/sec_13f_bulk_source_state.json ] ||
             [ -f .cache/sec_13f_bulk_completed_receipt.json ] ||
             [ -f .cache/sec_13f_bulk_rebuild_checkpoint.accession-discovery.json ] ||
             [ -f .cache/sec-security-master-rebuild-work/manifest.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save nonpublishable SEC cutover work
        if: always() && steps.clean_checkpoint.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/sec_13f_bulk_rebuild_checkpoint.json
            .cache/sec_13f_bulk_source_state.json
            .cache/sec_13f_bulk_completed_receipt.json
            .cache/sec_13f_bulk_indices/.rebuild-*.sqlite3.partial
            .cache/sec_13f_bulk_indices/index-*.sqlite3
            .cache/sec_13f_bulk_rebuild_checkpoint.accession-discovery.json
            .cache/sec-security-master-rebuild-work/manifest.json
            .cache/sec-security-master-rebuild-work/edgar-exception-batch-*.json
          key: >-
            sec-clean-v1-parser1-${{ runner.os }}-${{ steps.restore_snapshot.outputs.dataset_id }}-${{ steps.restore_snapshot.outputs.code_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove cached Form 13F working set before validation
        if: >-
          success() &&
          steps.restore_snapshot.outputs.legacy_snapshot == 'true'
        run: |
          python -c 'from sec_13f_bulk_backfill import cleanup_13f_bulk_working_set; cleanup_13f_bulk_working_set()'

      - name: Regenerate registry-backed site data
        id: regenerate
        if: steps.restore_snapshot.outputs.legacy_snapshot != 'true'
        # Reuse verified SEC identity evidence and rebuild changed dependencies.
        # The separate maintenance workflow refreshes sources and reconciles
        # broad filing indexes overnight; all freshness gates still apply here.
        timeout-minutes: 90
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/incremental_pipeline.py regenerate

      - name: Validate generated data
        id: validate_data
        # Validation runs only after both ingestion paths and regeneration
        # succeed. A failed replay leaves the last published data untouched.
        run: python validate_data.py --incremental

      - name: Run generated-data contract regression tests
        # Run the focused corpus contract here so stale-cache identity losses
        # fail before a private snapshot is published.
        run: python -m unittest discover -s tests -p 'test_data_contract.py' -v

      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -v

      - name: Test compressed site loader
        run: node --test tests/test_site_data_loader.mjs

      - name: Annotate ticker health report
        # Non-fatal: always runs, never fails the job. It surfaces informational
        # bucket counts as Actions notices; stale sources, schema changes, and
        # material coverage regressions are enforced by the fatal SEC-master
        # acceptance gate instead of becoming a perpetual manual queue.
        if: always()
        continue-on-error: true
        run: python scripts/annotate_ticker_health.py

      # Installation tokens expire after one hour. The pipeline can run for
      # several hours, so mint a fresh write-scoped credential immediately
      # before publication instead of reusing the restore credential.
      - name: Refresh private data publication credential
        id: publish-data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: write

      - name: Publish validated private snapshot
        id: publish_snapshot
        # The default success() guard requires the main ingest, recent-feed
        # replay, regeneration, and validation steps all to have succeeded.
        env:
          DATA_ARCHIVE_TOKEN: ${{ steps.publish-data-app-token.outputs.token }}
          BASE_DATASET_ID: ${{ steps.restore_snapshot.outputs.dataset_id }}
          GH_TOKEN: ${{ steps.publish-data-app-token.outputs.token }}
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_private_snapshot.sh

  deploy-pages:
    needs: update
    if: >-
      ${{ needs.update.result == 'success' &&
          needs.update.outputs.code_sha != '' &&
          needs.update.outputs.release_tag != '' &&
          needs.update.outputs.dataset_id != '' &&
          needs.update.outputs.site_changed == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      code_sha: ${{ needs.update.outputs.code_sha }}
      release_tag: ${{ needs.update.outputs.release_tag }}
      dataset_id: ${{ needs.update.outputs.dataset_id }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      deployments: read
      pages: write
      id-token: write

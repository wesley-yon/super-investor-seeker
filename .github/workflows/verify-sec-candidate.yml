name: Verify private SEC candidate without publishing

on:
  push:
    branches: [validation/sec-candidate-20260906]

permissions:
  contents: read

concurrency:
  group: sec-candidate-verification
  cancel-in-progress: false

env:
  DATA_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data
  CANDIDATE_RELEASE_TAG: candidate-sec-20260906-01

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Record standard runner capacity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sec-candidate-metrics"
          python - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          memory = {line.split(':')[0]: line.split(':')[1].strip()
                    for line in pathlib.Path('/proc/meminfo').read_text().splitlines()}
          disk = shutil.disk_usage(root)
          report = {'cpu_count': os.cpu_count(), 'memory_total': memory['MemTotal'],
                    'filesystem_total_bytes': disk.total, 'initial_free_bytes': disk.free,
                    'code_sha': os.environ['GITHUB_SHA'], 'production_publication': False}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sec-candidate-metrics/runner.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Authenticate for private candidate reads only
        id: data-read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Restore and verify exact private candidate
        env:
          DATA_ARCHIVE_TOKEN: ${{ steps.data-read-token.outputs.token }}
        run: |
          python scripts/measure_runner_phase.py --name restore \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            python scripts/restore_sec_candidate.py \
              --repository "$DATA_REPOSITORY" --tag "$CANDIDATE_RELEASE_TAG" \
              --expected-source-sha "$GITHUB_SHA"

      - name: Check current policies and SEC runtime identity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python - <<'PY'
          import os, pipeline
          assert '@' in os.environ.get('SEC_USER_AGENT', ''), 'SEC runtime identity is missing'
          state = pipeline.load_state()
          for key, required in (
              ('value_unit_migration_version', pipeline.VALUE_UNIT_MIGRATION_VERSION),
              ('amendment_reducer_version', pipeline.AMENDMENT_REDUCER_VERSION),
              ('security_identity_migration_version', pipeline.SECURITY_IDENTITY_VERSION),
          ):
              assert state.get(key, 0) >= required, f'Candidate still needs migration: {key}'
          print('The restored candidate is ready for the routine update path.')
          PY

      - name: Measure routine SEC filing ingestion
        timeout-minutes: 240
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          set +e
          python scripts/measure_runner_phase.py --name ingestion \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            timeout --signal=TERM --kill-after=120s 210m \
              python pipeline.py --all --quarters 4 --defer-regeneration
          phase_status=$?
          set -e
          if [ "$phase_status" -ne 0 ] && [ "$phase_status" -ne 124 ]; then exit "$phase_status"; fi

      - name: Measure recently accepted filing refresh
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RECENT_13F_QUARTERS: '4'
        run: |
          set -euo pipefail
          set +e
          python scripts/measure_runner_phase.py --name recent_filings \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            timeout --signal=TERM --kill-after=120s 15m \
              python scripts/refresh_recent_13f_filings.py
          phase_status=$?
          set -e
          if [ "$phase_status" -ne 0 ] && [ "$phase_status" -ne 124 ]; then exit "$phase_status"; fi

      - name: Measure SEC refresh and data regeneration
        timeout-minutes: 60
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/measure_runner_phase.py --name regeneration \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            python pipeline.py --regenerate-only --refresh-security-master

      - name: Measure full generated data validation
        run: |
          python scripts/measure_runner_phase.py --name validation \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            python validate_data.py

      - name: Run publication regression checks
        run: |
          python scripts/measure_runner_phase.py --name regression_tests \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            python -m unittest discover -s tests -v
          node --test tests/test_site_data_loader.mjs

      - name: Measure snapshot packing without upload
        run: |
          python scripts/measure_runner_phase.py --name packing \
            --report-dir "$RUNNER_TEMP/sec-candidate-metrics" -- \
            python scripts/data_snapshot.py pack \
              --root "$GITHUB_WORKSPACE" \
              --output-dir "$RUNNER_TEMP/sec-candidate-output" \
              --source-sha "$GITHUB_SHA"

      - name: Retain metrics in the run log and summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sec-candidate-metrics'
          rows = [json.loads(p.read_text()) for p in sorted(directory.glob('*.json'))]
          print('SEC_CANDIDATE_METRICS=' + json.dumps(rows, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Private SEC candidate verification; production publishing disabled.\n\n')
              summary.write('| Phase | Seconds | Exit | Peak process PSS GiB (sampled) | Minimum free disk GiB |\n')
              summary.write('|---|---:|---:|---:|---:|\n')
              for row in rows:
                  if 'phase' not in row:
                      continue
                  pss = row['peak_sampled_process_group_pss_bytes']
                  pss_text = 'unavailable' if pss is None else f'{pss / 2**30:.2f}'
                  summary.write(f"| {row['phase']} | {row['elapsed_seconds']:.1f} | {row['exit_code']} | {pss_text} | {row['minimum_free_bytes'] / 2**30:.2f} |\n")
          PY

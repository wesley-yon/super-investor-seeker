name: Verify protected environment credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-environment-credentials
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify ${{ matrix.environment }} (${{ matrix.contents }})
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: private-data
            contents: read
          - environment: private-data
            contents: write
          - environment: github-pages
            contents: read
    steps:
      # GitHub environment secrets override same-named repository secrets.
      # The owner must verify both environment entries exist before dispatch.
      - name: Authenticate with the protected environment key
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: ${{ matrix.contents }}

      - name: Verify scoped access without modifying data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data
        run: |
          set -euo pipefail
          gh api installation/repositories --jq '.repositories' |
            jq -e --arg expected "$EXPECTED_REPOSITORY" '
              length == 1 and .[0].full_name == $expected and .[0].private == true
            ' >/dev/null
          gh api "repos/$EXPECTED_REPOSITORY/releases/latest" --jq '.tag_name' |
            jq -Re 'test("^dataset-[A-Za-z0-9._-]+$")' >/dev/null
          echo "Authentication and scoped private release access passed."
          echo "No repository content or release was modified."
          echo "### Credential verification passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested token permissions were granted; scoped private release access succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "No key or token values were printed, and no data was changed." >> "$GITHUB_STEP_SUMMARY"

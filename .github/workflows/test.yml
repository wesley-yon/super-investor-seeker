name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The privacy gate below audits every reachable commit, not only the
          # current code-only tree.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint correctness hazards
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q *.py scripts

      - name: Reject current or historical private generated data
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- data/ .cache/)
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo "::error::Private generated data must be restored from snapshots, not tracked in Git"
            exit 1
          fi

          historical=$(
            git log --all --format= --name-only -- data/ .cache/ |
              sed '/^$/d' |
              sort -u
          )
          if [ -n "$historical" ]; then
            printf '%s\n' "$historical"
            echo "::error::Private generated data exists in reachable Git history"
            exit 1
          fi

      - name: Test compressed site loader
        run: node --test tests/test_site_data_loader.mjs tests/test_csp_worker.mjs

      - name: Run data-integrity regression tests
        run: python -m unittest discover -s tests -v

      - name: Prove tests did not create generated data
        run: |
          set -euo pipefail
          # Both paths are intentionally ignored, so git status cannot detect
          # a leaked test corpus or durable cache. A code-only checkout must
          # still have neither path after the suite.
          for private_path in data .cache; do
            if [ -e "$private_path" ]; then
              find "$private_path" -maxdepth 2 -type f -print | head -100 || true
              echo "::error::Tests left private generated data in $private_path"
              exit 1
            fi
          done

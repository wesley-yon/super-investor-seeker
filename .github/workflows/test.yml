name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    # A same-repository PR already runs this exact SHA through the branch-push
    # event. Keep pull_request coverage for forks without paying for, waiting
    # on, or receiving duplicate failure mail from a second hosted runner.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The privacy gate below audits every reachable commit, not only the
          # current code-only tree.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint correctness hazards
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q *.py scripts

      - name: Reject current or historical private generated data
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- data/ .cache/)
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo "::error::Private generated data must be restored from snapshots, not tracked in Git"
            exit 1
          fi

          historical=$(
            git log --all --format= --name-only -- data/ .cache/ |
              sed '/^$/d' |
              sort -u
          )
          if [ -n "$historical" ]; then
            printf '%s\n' "$historical"
            echo "::error::Private generated data exists in reachable Git history"
            exit 1
          fi

      - name: Test compressed site loader
        run: node --test tests/test_site_data_loader.mjs

      - name: Install pinned visual-test dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic visual and interaction suite
        run: npm run test:visual

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results-${{ runner.os }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run data-integrity regression tests
        run: python -m unittest discover -s tests -v

      - name: Prove tests did not create generated data
        run: |
          set -euo pipefail
          # Both paths are intentionally ignored, so git status cannot detect
          # a leaked test corpus or durable cache. A code-only checkout must
          # still have neither path after the suite.
          for private_path in data .cache; do
            if [ -e "$private_path" ]; then
              find "$private_path" -maxdepth 2 -type f -print | head -100 || true
              echo "::error::Tests left private generated data in $private_path"
              exit 1
            fi
          done

name: Deploy validated data to Pages

on:
  workflow_call:
    inputs:
      code_sha:
        description: Exact public repository commit to publish
        required: true
        type: string
      release_tag:
        description: Exact private dataset release to publish
        required: true
        type: string
      dataset_id:
        description: Exact private dataset digest to publish
        required: true
        type: string
    outputs:
      page_url:
        description: URL returned by the completed Pages deployment
        value: ${{ jobs.publish.outputs.page_url }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private dataset release for rollback; blank uses latest
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.nojekyll'
      - 'CNAME'
      - 'index.html'
      - 'app.js'
      - 'site-data-loader.js'
      - 'scripts/build_pages_artifact.py'
      - 'scripts/data_snapshot.py'
      - 'scripts/github_cli_retry.py'
      - 'scripts/pages_deploy_needed.sh'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-pages.yml'
      - '.github/workflows/finalize-private-snapshots.yml'
      - 'scripts/pages_deployment_identity.py'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# No workflow-wide lock: the publish job releases Pages before housekeeping
# waits for a data job. Reusable-workflow outputs carry the exact target.
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-pages.yml
    with:
      code_sha: ${{ inputs.code_sha || '' }}
      release_tag: ${{ inputs.release_tag || '' }}
      dataset_id: ${{ inputs.dataset_id || '' }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      deployments: read
      pages: write
      id-token: write

  finalize-private-snapshots:
    needs: publish
    if: >-
      ${{ github.ref == 'refs/heads/main' && needs.publish.result == 'success' &&
          needs.publish.outputs.deployment_id != '' }}
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/finalize-private-snapshots.yml
    with:
      code_sha: ${{ needs.publish.outputs.code_sha }}
      release_tag: ${{ needs.publish.outputs.release_tag }}
      dataset_id: ${{ needs.publish.outputs.dataset_id }}
      resolved_latest_release_tag: ${{ needs.publish.outputs.resolved_latest_release_tag }}
      allow_older_release: ${{ needs.publish.outputs.allow_older_release }}
      deployment_id: ${{ needs.publish.outputs.deployment_id }}
    secrets: inherit
    permissions:
      contents: read
      deployments: read
      pages: read

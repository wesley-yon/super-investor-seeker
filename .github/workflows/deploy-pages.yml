name: Deploy validated data to Pages

on:
  workflow_call:
    inputs:
      code_sha:
        description: Exact public repository commit to publish
        required: true
        type: string
      release_tag:
        description: Exact private dataset release to publish
        required: true
        type: string
      dataset_id:
        description: Exact private dataset digest to publish
        required: true
        type: string
    outputs:
      page_url:
        description: URL returned by the completed Pages deployment
        value: ${{ jobs.deploy.outputs.page_url }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private dataset release for rollback; blank uses latest
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.nojekyll'
      - 'CNAME'
      - 'index.html'
      - 'site-data-loader.js'
      - 'scripts/build_pages_artifact.py'
      - 'scripts/data_snapshot.py'
      - 'scripts/github_cli_retry.py'
      - 'scripts/pages_deploy_needed.sh'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: pages-production
  cancel-in-progress: false

env:
  DATA_REPOSITORY: ${{ github.repository_owner }}/super-investor-seeker-data

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      pages: read
    outputs:
      code_sha: ${{ steps.target.outputs.code_sha }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      dataset_id: ${{ steps.target.outputs.dataset_id }}
      resolved_latest_release_tag: ${{ steps.target.outputs.resolved_latest_release_tag }}
      deploy_needed: ${{ steps.target.outputs.deploy_needed }}
      allow_older_release: ${{ steps.target.outputs.allow_older_release }}
    steps:
      - name: Checkout explicitly requested code target
        if: inputs.code_sha != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            CNAME
            scripts/github_cli_retry.py
            scripts/pages_deploy_needed.sh

      - name: Checkout push code target
        if: inputs.code_sha == '' && github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            CNAME
            scripts/github_cli_retry.py
            scripts/pages_deploy_needed.sh

      - name: Checkout live main recovery target
        if: inputs.code_sha == '' && github.event_name != 'push'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            CNAME
            scripts/github_cli_retry.py
            scripts/pages_deploy_needed.sh

      # Retry policy is workflow machinery, not part of the historical code
      # target. Keep manual rollbacks to commits from before this helper was
      # introduced working by loading it from the commit that defines this job.
      - name: Checkout trusted GitHub retry helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflow-tools
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/github_cli_retry.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authenticate to the private data repository
        id: data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Resolve exact code and private dataset target
        id: target
        env:
          DATA_ARCHIVE_TOKEN: ${{ steps.data-app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.data-app-token.outputs.token }}
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_CODE_SHA: ${{ inputs.code_sha }}
          REQUESTED_DATASET_ID: ${{ inputs.dataset_id }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh_read_retry() {
            python "$GITHUB_WORKSPACE/.workflow-tools/scripts/github_cli_retry.py" \
              --retry-forbidden-read -- "$@"
          }

          code_sha=$(git rev-parse HEAD)
          if [[ ! "$code_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid resolved code SHA: $code_sha"
            exit 1
          fi
          if [ -n "$REQUESTED_CODE_SHA" ]; then
            if [[ ! "$REQUESTED_CODE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [ "$code_sha" != "$REQUESTED_CODE_SHA" ]; then
              echo "::error::Checked out $code_sha, expected $REQUESTED_CODE_SHA"
              exit 1
            fi
          elif [ "$EVENT_NAME" = push ] && [ "$code_sha" != "$EVENT_SHA" ]; then
            echo "::error::Checked out $code_sha, expected push commit $EVENT_SHA"
            exit 1
          fi

          latest_release_tag=$(
            gh_read_retry api "/repos/$DATA_REPOSITORY/releases/latest" --jq '.tag_name'
          )
          if [[ ! "$latest_release_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::No valid latest dataset release was resolved"
            exit 1
          fi

          allow_older_release=false
          release_tag="$REQUESTED_RELEASE_TAG"
          if [ -z "$release_tag" ]; then
            # The GitHub latest-release pointer is the durable Pages target.
            # It changes for a new publication or a verified manual rollback,
            # rather than merely because another release has a newer date.
            release_tag="$latest_release_tag"
          elif [ -z "$REQUESTED_CODE_SHA" ]; then
            # Only an explicit manual dispatch may intentionally roll Pages
            # back to an older validated private release.
            allow_older_release=true
          fi
          if [[ ! "$release_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::No valid published dataset release was resolved"
            exit 1
          fi

          release_json=$(gh_read_retry api "/repos/$DATA_REPOSITORY/releases/tags/$release_tag")
          if [ "$(jq -r '.draft or .prerelease' <<<"$release_json")" != false ]; then
            echo "::error::Dataset target must be a published, non-prerelease release"
            exit 1
          fi
          manifest_dir=$(mktemp -d "$RUNNER_TEMP/snapshot-manifest.XXXXXX")
          gh_read_retry release download "$release_tag" \
            --repo "$DATA_REPOSITORY" \
            --pattern '*.manifest.json' \
            --dir "$manifest_dir" \
            --clobber
          if [ "$(find "$manifest_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "::error::Dataset release must contain exactly one snapshot manifest"
            exit 1
          fi
          manifest_path=$(find "$manifest_dir" -maxdepth 1 -type f)
          dataset_id=$(jq -er '.dataset_id' "$manifest_path")
          if [[ ! "$dataset_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Dataset release contains an invalid dataset ID"
            exit 1
          fi
          if [ -n "$REQUESTED_DATASET_ID" ] &&
             [ "$dataset_id" != "$REQUESTED_DATASET_ID" ]; then
            echo "::error::Release $release_tag contains $dataset_id, expected $REQUESTED_DATASET_ID"
            exit 1
          fi

          deploy_needed=$(
            GH_TOKEN="$PUBLIC_GITHUB_TOKEN" \
              DATA_ARCHIVE_TOKEN="$DATA_ARCHIVE_TOKEN" \
              DATA_REPOSITORY="$DATA_REPOSITORY" \
              bash scripts/pages_deploy_needed.sh \
                "$code_sha" "$dataset_id" "$release_tag"
          )
          echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "dataset_id=$dataset_id" >> "$GITHUB_OUTPUT"
          echo "resolved_latest_release_tag=$latest_release_tag" >> "$GITHUB_OUTPUT"
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "allow_older_release=$allow_older_release" >> "$GITHUB_OUTPUT"
          if [ "$deploy_needed" = true ]; then
            echo "Pages must publish code $code_sha with dataset $dataset_id"
          else
            echo "Live Pages already serves code $code_sha with dataset $dataset_id"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout exact public code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.code_sha }}
          fetch-depth: 1

      - name: Verify exact code checkout
        env:
          ALLOW_OLDER_RELEASE: ${{ needs.resolve.outputs.allow_older_release }}
          EXPECTED_CODE_SHA: ${{ needs.resolve.outputs.code_sha }}
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$EXPECTED_CODE_SHA" ]; then
            echo "::error::Checked out $checked_out_sha, expected $EXPECTED_CODE_SHA"
            exit 1
          fi

      - name: Authenticate to the private data repository
        id: data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Restore exact validated private snapshot
        env:
          DATA_ARCHIVE_TOKEN: ${{ steps.data-app-token.outputs.token }}
          EXPECTED_DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          restore_json=$(
            python scripts/data_snapshot.py pull \
              --repository "$DATA_REPOSITORY" \
              --release-tag "$EXPECTED_RELEASE_TAG" \
              --root "$GITHUB_WORKSPACE" \
              --replace
          )
          restored_tag=$(jq -er '.release_tag' <<<"$restore_json")
          restored_id=$(jq -er '.dataset_id' <<<"$restore_json")
          if [ "$restored_tag" != "$EXPECTED_RELEASE_TAG" ] ||
             [ "$restored_id" != "$EXPECTED_DATASET_ID" ]; then
            echo "::error::Restored snapshot does not match the resolved Pages target"
            exit 1
          fi

      - name: Validate restored snapshot against current code
        # A code-only change or manual rollback can pair today's validator and
        # frontend with an older retained dataset. Re-run the full corpus gate
        # before building so an incompatible combination cannot go live.
        run: python validate_data.py

      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -v

      - name: Test compressed site loader
        run: node --test tests/test_site_data_loader.mjs

      - name: Build bounded public Pages artifact
        env:
          EXPECTED_CODE_SHA: ${{ needs.resolve.outputs.code_sha }}
          EXPECTED_DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
        run: |
          set -euo pipefail
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/pages-site.XXXXXX")
          python scripts/build_pages_artifact.py \
            --output "$artifact_dir" \
            --source-sha "$EXPECTED_CODE_SHA" \
            --dataset-id "$EXPECTED_DATASET_ID" \
            --max-archive-bytes 1000000000
          if [ "$(jq -er '.source_sha' "$artifact_dir/deployment-manifest.json")" != "$EXPECTED_CODE_SHA" ] ||
             [ "$(jq -er '.dataset_id' "$artifact_dir/deployment-manifest.json")" != "$EXPECTED_DATASET_ID" ]; then
            echo "::error::Pages manifest does not identify the exact code and dataset inputs"
            exit 1
          fi
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Audit the public artifact allowlist
        run: |
          set -euo pipefail
          if find "$ARTIFACT_DIR" -type l -print -quit | grep -q .; then
            echo "::error::Pages artifact contains a symlink"
            exit 1
          fi
          while IFS= read -r -d '' path; do
            relative=${path#"$ARTIFACT_DIR"/}
            case "$relative" in
              .nojekyll|CNAME|index.html|site-data-loader.js|deployment-manifest.json|data/funds-index.json|data/index.json|data/security_labels.json|data/funds/*.json.gz|data/stocks/*.json.gz)
                ;;
              *)
                echo "::error::Unexpected public Pages file: $relative"
                exit 1
                ;;
            esac
          done < <(find "$ARTIFACT_DIR" -type f -print0)

      - name: Ensure Actions is the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/pages" \
              --jq '.build_type'
          )
          if [ "$build_type" != workflow ]; then
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/pages" \
              -f build_type=workflow >/dev/null
          fi
          verified_type=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/pages" \
              --jq '.build_type'
          )
          if [ "$verified_type" != workflow ]; then
            echo "::error::Set Settings > Pages > Source to GitHub Actions"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload bounded Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.ARTIFACT_DIR }}
          include-hidden-files: true

  deploy:
    needs: [resolve, build]
    if: >-
      ${{ needs.resolve.outputs.deploy_needed == 'true' &&
          needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout live main for stale-deploy guard
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/pages_deploy_needed.sh

      - name: Authenticate to the private data repository
        id: data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Refuse an artifact superseded by newer public or private inputs
        env:
          ALLOW_OLDER_RELEASE: ${{ needs.resolve.outputs.allow_older_release }}
          EXPECTED_CODE_SHA: ${{ needs.resolve.outputs.code_sha }}
          EXPECTED_DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ steps.data-app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$current_sha" != "$EXPECTED_CODE_SHA" ]; then
            public_inputs_changed=$(
              bash scripts/pages_deploy_needed.sh \
                --between "$EXPECTED_CODE_SHA" "$current_sha"
            )
            if [ "$public_inputs_changed" = true ]; then
              echo "::error::Refusing stale Pages artifact; main now has newer public inputs"
              exit 1
            fi
            echo "::notice::main advanced only in non-Pages state; built public content remains current"
          fi

          release_json=$(gh api "/repos/$DATA_REPOSITORY/releases/tags/$EXPECTED_RELEASE_TAG")
          if [ "$(jq -r '.draft or .prerelease' <<<"$release_json")" != false ]; then
            echo "::error::Expected dataset release is no longer published"
            exit 1
          fi
          manifest_dir=$(mktemp -d "$RUNNER_TEMP/deploy-manifest.XXXXXX")
          gh release download "$EXPECTED_RELEASE_TAG" \
            --repo "$DATA_REPOSITORY" \
            --pattern '*.manifest.json' \
            --dir "$manifest_dir"
          manifest_path=$(find "$manifest_dir" -maxdepth 1 -type f)
          if [ "$(find "$manifest_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 1 ] ||
             [ "$(jq -er '.dataset_id' "$manifest_path")" != "$EXPECTED_DATASET_ID" ]; then
            echo "::error::Expected private release no longer matches the built dataset"
            exit 1
          fi

          if [ "$ALLOW_OLDER_RELEASE" != true ]; then
            active_release_tag=$(
              gh api "/repos/$DATA_REPOSITORY/releases/latest" --jq '.tag_name'
            )
            if [ "$active_release_tag" != "$EXPECTED_RELEASE_TAG" ]; then
              echo "::error::Refusing stale Pages artifact; the active private release changed"
              exit 1
            fi
          fi

      - name: Deploy exact validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Verify live deployment manifest
        env:
          EXPECTED_CODE_SHA: ${{ needs.resolve.outputs.code_sha }}
          EXPECTED_DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          manifest_url="${PAGE_URL%/}/deployment-manifest.json"
          headers_file=$(mktemp "$RUNNER_TEMP/pages-manifest-headers.XXXXXX")
          body_file=$(mktemp "$RUNNER_TEMP/pages-manifest-body.XXXXXX")
          trap 'rm -f "$headers_file" "$body_file"' EXIT
          saw_mismatched_identity=false
          saw_non_challenge_http=false
          for attempt in $(seq 1 24); do
            : > "$headers_file"
            : > "$body_file"
            observed_code_sha=""
            observed_dataset_id=""
            if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 5 \
                --dump-header "$headers_file" \
                --output "$body_file" \
                -H "Cache-Control: no-cache" \
                "${manifest_url}?code=${EXPECTED_CODE_SHA}&dataset=${EXPECTED_DATASET_ID}&attempt=${attempt}" \
                2>/dev/null; then
              observed_code_sha=$(jq -r '.source_sha // empty' "$body_file" 2>/dev/null || true)
              observed_dataset_id=$(jq -r '.dataset_id // empty' "$body_file" 2>/dev/null || true)
            fi
            http_status=$(
              awk '/^HTTP\// { status=$2 } END { print status }' "$headers_file" |
                tr -d '\r'
            )
            if [ "$observed_code_sha" = "$EXPECTED_CODE_SHA" ] &&
               [ "$observed_dataset_id" = "$EXPECTED_DATASET_ID" ]; then
              echo "Live Pages serves code $EXPECTED_CODE_SHA with dataset $EXPECTED_DATASET_ID"
              exit 0
            fi
            if [ -n "$observed_code_sha" ] || [ -n "$observed_dataset_id" ]; then
              saw_mismatched_identity=true
            fi
            if [ "$http_status" = 403 ] &&
               grep -qiE '^server:[[:space:]]*cloudflare[[:space:]]*$' "$headers_file" &&
               grep -qiE '^cf-mitigated:[[:space:]]*challenge[[:space:]]*$' "$headers_file"; then
              if [ "$saw_mismatched_identity" = false ] &&
                 [ "$saw_non_challenge_http" = false ]; then
                # deploy-pages already polled this exact uploaded artifact to
                # success; only independent public readback is unavailable.
                echo "::notice::Exact Pages artifact deployed; Cloudflare requires a browser challenge for public manifest readback"
                exit 0
              fi
            elif [ -n "$http_status" ]; then
              saw_non_challenge_http=true
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          echo "::error::Pages completed but did not serve the expected code and dataset"
          exit 1

  finalize-private-snapshots:
    needs: [resolve, deploy]
    if: >-
      ${{ always() &&
          needs.resolve.result == 'success' &&
          (needs.resolve.outputs.deploy_needed == 'false' ||
           needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      pages: read
    steps:
      - name: Checkout trusted GitHub retry helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/github_cli_retry.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authenticate to the private data repository
        id: data-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: write

      - name: Repair deployment marker and finalize active snapshot set
        env:
          ALLOW_OLDER_RELEASE: ${{ needs.resolve.outputs.allow_older_release }}
          EXPECTED_CODE_SHA: ${{ needs.resolve.outputs.code_sha }}
          EXPECTED_DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          EXPECTED_PREVIOUS_LATEST_RELEASE_TAG: ${{ needs.resolve.outputs.resolved_latest_release_tag }}
          GH_TOKEN: ${{ steps.data-app-token.outputs.token }}
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readonly TRANSIENT_MUTATION_EXIT_CODE=75
          readonly -a RETRY_DELAYS_SECONDS=(1 3)

          gh_read_retry() {
            python scripts/github_cli_retry.py --retry-forbidden-read -- "$@"
          }
          gh_mutate_once() {
            python scripts/github_cli_retry.py -- "$@"
          }
          gh_delete_once() {
            python scripts/github_cli_retry.py --allow-release-not-found -- "$@"
          }
          release_state() {
            local tag=$1
            gh_read_retry api --paginate --slurp \
              "/repos/$DATA_REPOSITORY/releases?per_page=100" |
              jq -er --arg tag "$tag" '
                (add // [])
                | map(select(.tag_name == $tag))
                | if length == 0 then "missing"
                  elif length == 1 then (.[0].draft | tostring)
                  else error("duplicate release tag")
                  end
              '
          }
          tag_ref_state() {
            local tag=$1
            gh_read_retry api \
              "/repos/$DATA_REPOSITORY/git/matching-refs/tags/$tag" |
              jq -er --arg ref "refs/tags/$tag" '
                map(select(.ref == $ref))
                | if length == 0 then "missing"
                  elif length == 1 then "present"
                  else error("duplicate exact tag ref")
                  end
              '
          }
          sleep_before_retry() {
            local attempt=$1
            if [ "$attempt" -ge "${#RETRY_DELAYS_SECONDS[@]}" ]; then
              return 1
            fi
            sleep "${RETRY_DELAYS_SECONDS[$attempt]}"
          }
          wait_for_release_missing() {
            local tag=$1
            local observation_attempt
            for observation_attempt in 0 1 2; do
              if [ "$(release_state "$tag")" = missing ]; then
                return 0
              fi
              if ! sleep_before_retry "$observation_attempt"; then
                return 1
              fi
            done
          }
          wait_for_tag_missing() {
            local tag=$1
            local observation_attempt
            for observation_attempt in 0 1 2; do
              if [ "$(tag_ref_state "$tag")" = missing ]; then
                return 0
              fi
              if ! sleep_before_retry "$observation_attempt"; then
                return 1
              fi
            done
          }
          reconcile_tag_deletion() {
            local tag=$1
            local attempt
            local mutation_status
            local observed_tag_state

            if [[ ! "$tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Refusing to delete unexpected tag: $tag"
              return 1
            fi
            for attempt in 0 1 2; do
              observed_tag_state=$(tag_ref_state "$tag")
              if [ "$observed_tag_state" = missing ]; then
                return 0
              fi

              mutation_status=0
              gh_mutate_once api --method DELETE \
                "/repos/$DATA_REPOSITORY/git/refs/tags/$tag" || \
                mutation_status=$?
              if wait_for_tag_missing "$tag"; then
                return 0
              fi
              if [ "$mutation_status" -ne "$TRANSIENT_MUTATION_EXIT_CODE" ] ||
                 ! sleep_before_retry "$attempt"; then
                return 1
              fi
            done
            return 1
          }
          marker_matches_remote() {
            local candidate_dir
            local remote_marker
            candidate_dir=$(mktemp -d "$RUNNER_TEMP/verified-marker.XXXXXX")
            if ! gh_read_retry release download "$EXPECTED_RELEASE_TAG" \
                --repo "$DATA_REPOSITORY" \
                --pattern pages-deployment.json \
                --dir "$candidate_dir" \
                --clobber; then
              rm -rf "$candidate_dir"
              return 1
            fi
            remote_marker="$candidate_dir/pages-deployment.json"
            if [ ! -f "$remote_marker" ] ||
               [ "$(jq -er '.code_sha' "$remote_marker" 2>/dev/null || true)" != "$EXPECTED_CODE_SHA" ] ||
               [ "$(jq -er '.dataset_id' "$remote_marker" 2>/dev/null || true)" != "$EXPECTED_DATASET_ID" ] ||
               [ "$(jq -er '.release_tag' "$remote_marker" 2>/dev/null || true)" != "$EXPECTED_RELEASE_TAG" ] ||
               [ "$(jq -er '.deployment_id' "$remote_marker" 2>/dev/null || true)" != "$deployment_id" ] ||
               [ "$(jq -er '.deployed_at' "$remote_marker" 2>/dev/null || true)" != "$deployed_at" ]; then
              rm -rf "$candidate_dir"
              return 1
            fi
            rm -rf "$candidate_dir"
          }
          wait_for_marker_match() {
            local observation_attempt
            for observation_attempt in 0 1 2; do
              if marker_matches_remote; then
                return 0
              fi
              if ! sleep_before_retry "$observation_attempt"; then
                return 1
              fi
            done
            return 1
          }
          observe_latest_release() {
            local target_tag=$1
            local allowed_previous_tag=$2
            local observed_latest_tag

            if ! observed_latest_tag=$(
                gh_read_retry api "/repos/$DATA_REPOSITORY/releases/latest" --jq '.tag_name'
              ); then
              return 3
            fi
            active_release_tag="$observed_latest_tag"
            if [ "$observed_latest_tag" = "$target_tag" ]; then
              return 0
            fi
            if [ "$observed_latest_tag" = "$allowed_previous_tag" ]; then
              return 1
            fi
            return 2
          }
          wait_for_latest_release() {
            local target_tag=$1
            local allowed_previous_tag=$2
            local observation_attempt
            local observation_status

            for observation_attempt in 0 1 2; do
              observation_status=0
              observe_latest_release "$target_tag" "$allowed_previous_tag" || \
                observation_status=$?
              if [ "$observation_status" -eq 0 ]; then
                return 0
              fi
              if [ "$observation_status" -ne 1 ]; then
                return "$observation_status"
              fi
              if ! sleep_before_retry "$observation_attempt"; then
                return 1
              fi
            done
            return 1
          }

          if [[ ! "$EXPECTED_PREVIOUS_LATEST_RELEASE_TAG" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Resolved latest release precondition is invalid"
            exit 1
          fi

          # Revalidate the exact private input before recording or deleting
          # anything. The resolve/deploy gates establish that this target is
          # live; the newest successful Pages deployment is therefore the
          # deployment that currently serves this manifest.
          release_json=$(gh_read_retry api "/repos/$DATA_REPOSITORY/releases/tags/$EXPECTED_RELEASE_TAG")
          if [ "$(jq -r '.draft or .prerelease' <<<"$release_json")" != false ]; then
            echo "::error::Active dataset target is no longer published"
            exit 1
          fi
          manifest_dir=$(mktemp -d "$RUNNER_TEMP/finalize-manifest.XXXXXX")
          gh_read_retry release download "$EXPECTED_RELEASE_TAG" \
            --repo "$DATA_REPOSITORY" \
            --pattern '*.manifest.json' \
            --dir "$manifest_dir" \
            --clobber
          if [ "$(find "$manifest_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "::error::Active dataset release must contain exactly one manifest"
            exit 1
          fi
          manifest_path=$(find "$manifest_dir" -maxdepth 1 -type f)
          if [ "$(jq -er '.dataset_id' "$manifest_path")" != "$EXPECTED_DATASET_ID" ]; then
            echo "::error::Active dataset manifest changed before finalization"
            exit 1
          fi

          # A non-rollback deployment can wait behind a concurrent publisher at
          # this job's shared lock. If that publisher installed a genuinely
          # newer latest release while Pages was deploying, this run is safely
          # superseded: its exact artifact already deployed, but the newer
          # release's own Pages run must own marker repair and retention.
          active_release_json=$(
            gh_read_retry api "/repos/$DATA_REPOSITORY/releases/latest"
          )
          active_release_tag=$(jq -r '.tag_name // empty' <<<"$active_release_json")
          if [ "$ALLOW_OLDER_RELEASE" != true ] &&
             [ "$active_release_tag" != "$EXPECTED_RELEASE_TAG" ]; then
            if [ "$EXPECTED_PREVIOUS_LATEST_RELEASE_TAG" != "$EXPECTED_RELEASE_TAG" ] ||
               [[ ! "$active_release_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]] ||
               ! jq -e --argjson expected_release "$release_json" '
                   type == "object"
                   and ((.tag_name | type) == "string")
                   and ((.draft | type) == "boolean")
                   and (.draft == false)
                   and ((.prerelease | type) == "boolean")
                   and (.prerelease == false)
                   and ((.published_at | type) == "string")
                   and (($expected_release | type) == "object")
                   and (($expected_release.published_at | type) == "string")
                   and ((.published_at | fromdateiso8601)
                     > ($expected_release.published_at | fromdateiso8601))
                 ' <<<"$active_release_json" >/dev/null; then
              echo "::error::The active release changed unexpectedly before finalization"
              exit 1
            fi
            echo "::notice::Deployment target $EXPECTED_RELEASE_TAG was superseded by newer active release $active_release_tag before finalization; leaving marker repair and retention to the newer deployment"
            exit 0
          fi

          deployment_json=$(
            GH_TOKEN="$PUBLIC_GITHUB_TOKEN" gh_read_retry api \
              "/repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20"
          )
          deployment_id=""
          deployed_at=""
          mapfile -t deployment_ids < <(jq -r '.[].id' <<<"$deployment_json")
          for candidate_id in "${deployment_ids[@]}"; do
            if [[ ! "$candidate_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Pages deployment API returned an invalid identity"
              exit 1
            fi
            candidate_status_json=$(
              GH_TOKEN="$PUBLIC_GITHUB_TOKEN" gh_read_retry api \
                "/repos/$GITHUB_REPOSITORY/deployments/$candidate_id/statuses?per_page=1"
            )
            candidate_status=$(jq -r '.[0].state // empty' <<<"$candidate_status_json")
            if [ "$candidate_status" = success ]; then
              candidate_deployed_at=$(
                jq -r '.[0].created_at // empty' <<<"$candidate_status_json"
              )
              if ! jq -e '.[0].created_at | fromdateiso8601' \
                  <<<"$candidate_status_json" >/dev/null; then
                echo "::error::Successful Pages deployment has no valid status timestamp"
                exit 1
              fi
              deployment_id="$candidate_id"
              deployed_at="$candidate_deployed_at"
              break
            fi
          done
          if [[ ! "$deployment_id" =~ ^[0-9]+$ ]] || [ -z "$deployed_at" ]; then
            echo "::error::Could not associate the active target with a successful Pages deployment"
            exit 1
          fi

          marker_path="$RUNNER_TEMP/pages-deployment.json"
          jq -n \
            --arg code_sha "$EXPECTED_CODE_SHA" \
            --arg dataset_id "$EXPECTED_DATASET_ID" \
            --arg release_tag "$EXPECTED_RELEASE_TAG" \
            --arg deployment_id "$deployment_id" \
            --arg deployed_at "$deployed_at" \
            '{code_sha: $code_sha, dataset_id: $dataset_id, release_tag: $release_tag, deployment_id: ($deployment_id | tonumber), deployed_at: $deployed_at}' \
            > "$marker_path"
          marker_verified=false
          for attempt in 0 1 2; do
            mutation_status=0
            gh_mutate_once release upload "$EXPECTED_RELEASE_TAG" "$marker_path" \
              --repo "$DATA_REPOSITORY" \
              --clobber || mutation_status=$?
            if wait_for_marker_match; then
              marker_verified=true
              break
            fi
            if [ "$mutation_status" -ne "$TRANSIENT_MUTATION_EXIT_CODE" ] ||
               ! sleep_before_retry "$attempt"; then
              break
            fi
          done
          if [ "$marker_verified" != true ]; then
            echo "::error::Private Pages deployment marker did not round-trip exactly after bounded attempts"
            exit 1
          fi

          active_release_tag=$(gh_read_retry api "/repos/$DATA_REPOSITORY/releases/latest" --jq '.tag_name')
          if [ "$ALLOW_OLDER_RELEASE" = true ]; then
            # The resolve job captured the pointer that this rollback intends to
            # replace. This job shares the publication lock with every automated
            # publisher, so a mismatch means the rollback became stale while
            # Pages was deploying and must not overwrite a newer publication.
            rollback_verified=false
            for attempt in 0 1 2; do
              rollback_observation_status=0
              observe_latest_release \
                "$EXPECTED_RELEASE_TAG" \
                "$EXPECTED_PREVIOUS_LATEST_RELEASE_TAG" || \
                rollback_observation_status=$?
              if [ "$rollback_observation_status" -eq 0 ]; then
                rollback_verified=true
                break
              fi
              if [ "$rollback_observation_status" -eq 2 ]; then
                echo "::error::Refusing stale rollback because the latest release pointer changed"
                exit 1
              fi
              if [ "$rollback_observation_status" -ne 1 ]; then
                break
              fi

              mutation_status=0
              gh_mutate_once release edit "$EXPECTED_RELEASE_TAG" \
                --repo "$DATA_REPOSITORY" \
                --latest || mutation_status=$?

              rollback_observation_status=0
              wait_for_latest_release \
                "$EXPECTED_RELEASE_TAG" \
                "$EXPECTED_PREVIOUS_LATEST_RELEASE_TAG" || \
                rollback_observation_status=$?
              if [ "$rollback_observation_status" -eq 0 ]; then
                rollback_verified=true
                break
              fi
              if [ "$rollback_observation_status" -eq 2 ]; then
                echo "::error::Refusing stale rollback because a different release became latest"
                exit 1
              fi
              # Do not replay a confirmed latest-pointer edit merely because
              # GitHub's read path stayed stale through the observation window.
              if [ "$rollback_observation_status" -ne 1 ] ||
                 [ "$mutation_status" -ne "$TRANSIENT_MUTATION_EXIT_CODE" ] ||
                 ! sleep_before_retry "$attempt"; then
                break
              fi
            done
            if [ "$rollback_verified" != true ]; then
              echo "::error::Could not reconcile the verified rollback pointer after bounded attempts"
              exit 1
            fi
          elif [ "$active_release_tag" != "$EXPECTED_RELEASE_TAG" ]; then
            # A new dataset may have published while a scheduled recovery run
            # was finishing. Never let that stale run roll the pointer back.
            echo "::error::The active release changed before finalization"
            exit 1
          fi
          if [ "$active_release_tag" != "$EXPECTED_RELEASE_TAG" ]; then
            echo "::error::Could not persist the verified Pages target as the active release"
            exit 1
          fi

          releases_json=$(
            gh_read_retry api --paginate --slurp \
              "/repos/$DATA_REPOSITORY/releases?per_page=100"
          )
          stale_draft_cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          fallback_tag=$(
            jq -r --arg active "$EXPECTED_RELEASE_TAG" '
              add
              | map(
                  select(
                    ((.draft or .prerelease) | not)
                    and (.tag_name | startswith("dataset-"))
                    and .tag_name != $active
                  )
                )
              | sort_by(.published_at // .created_at)
              | reverse
              | .[0].tag_name // empty
            ' <<<"$releases_json"
          )
          mapfile -t delete_tags < <(
            jq -r \
              --arg active "$EXPECTED_RELEASE_TAG" \
              --arg fallback "$fallback_tag" \
              --arg stale_draft_cutoff "$stale_draft_cutoff" '
              add
              | map(select(.tag_name | startswith("dataset-")))
              | .[]
              | select(
                  (
                    (.draft or .prerelease)
                    and .created_at < $stale_draft_cutoff
                  )
                  or
                  (
                    ((.draft or .prerelease) | not)
                    and .tag_name != $active
                    and ($fallback == "" or .tag_name != $fallback)
                  )
                )
              | .tag_name
            ' <<<"$releases_json"
          )
          for release_tag in "${delete_tags[@]}"; do
            if [[ ! "$release_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Refusing to delete unexpected release tag: $release_tag"
              exit 1
            fi
            deletion_verified=false
            for attempt in 0 1 2; do
              observed_release_state=$(release_state "$release_tag")
              if [ "$observed_release_state" = missing ]; then
                deletion_verified=true
                break
              fi

              mutation_status=0
              gh_delete_once release delete "$release_tag" \
                --repo "$DATA_REPOSITORY" \
                --cleanup-tag \
                --yes || mutation_status=$?
              if wait_for_release_missing "$release_tag"; then
                deletion_verified=true
                break
              fi
              if [ "$mutation_status" -ne "$TRANSIENT_MUTATION_EXIT_CODE" ] ||
                 ! sleep_before_retry "$attempt"; then
                break
              fi
            done
            if [ "$deletion_verified" != true ]; then
              echo "::error::Stale release deletion could not be reconciled after bounded attempts: $release_tag"
              exit 1
            fi

            # gh release delete --cleanup-tag can remove the release before the
            # tag deletion is observable. Reconcile the tag independently.
            if ! reconcile_tag_deletion "$release_tag"; then
              echo "::error::Stale tag deletion could not be reconciled after bounded attempts: $release_tag"
              exit 1
            fi
          done

          # A prior run can be interrupted after deleting a release but before
          # deleting its tag. Sweep every dataset-* tag that no longer has a
          # release so the next publication cannot collide with that orphan.
          retained_json=$(
            gh_read_retry api --paginate --slurp \
              "/repos/$DATA_REPOSITORY/releases?per_page=100"
          )
          dataset_tag_refs_json=$(
            gh_read_retry api --paginate --slurp \
              "/repos/$DATA_REPOSITORY/git/matching-refs/tags/dataset-"
          )
          orphan_tags_json=$(
            jq -cn \
              --argjson release_pages "$retained_json" \
              --argjson ref_pages "$dataset_tag_refs_json" '
              ($release_pages | add // [] | map(.tag_name)) as $release_tags
              | (
                  ($ref_pages | add // []
                    | map(.ref | sub("^refs/tags/"; ""))
                    | unique)
                  - $release_tags
                )
            '
          )
          mapfile -t orphan_tags < <(jq -r '.[]' <<<"$orphan_tags_json")
          for orphan_tag in "${orphan_tags[@]}"; do
            if [[ ! "$orphan_tag" =~ ^dataset-[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Refusing to delete unexpected orphan tag: $orphan_tag"
              exit 1
            fi
            if [ "$orphan_tag" = "$EXPECTED_RELEASE_TAG" ] ||
               { [ -n "$fallback_tag" ] && [ "$orphan_tag" = "$fallback_tag" ]; }; then
              echo "::error::Refusing to delete protected snapshot tag: $orphan_tag"
              exit 1
            fi
            if [ "$(release_state "$orphan_tag")" != missing ]; then
              echo "::error::Refusing to delete tag because its release appeared during reconciliation: $orphan_tag"
              exit 1
            fi
            if ! reconcile_tag_deletion "$orphan_tag"; then
              echo "::error::Orphan tag deletion could not be reconciled after bounded attempts: $orphan_tag"
              exit 1
            fi
          done

          # Fail closed if cleanup did not leave precisely the active release
          # plus the newest available fallback (or only active when no fallback
          # exists yet).
          retained_json=$(
            gh_read_retry api --paginate --slurp \
              "/repos/$DATA_REPOSITORY/releases?per_page=100"
          )
          mapfile -t retained_tags < <(
            jq -r '
              add
              | map(
                  select(
                    ((.draft or .prerelease) | not)
                    and (.tag_name | startswith("dataset-"))
                  )
                )
              | .[].tag_name
            ' <<<"$retained_json"
          )
          expected_count=1
          if [ -n "$fallback_tag" ]; then
            expected_count=2
          fi
          if [ "${#retained_tags[@]}" -ne "$expected_count" ] ||
             ! printf '%s\n' "${retained_tags[@]}" | grep -Fxq "$EXPECTED_RELEASE_TAG" ||
             { [ -n "$fallback_tag" ] && ! printf '%s\n' "${retained_tags[@]}" | grep -Fxq "$fallback_tag"; }; then
            echo "::error::Snapshot retention did not leave the active release and one fallback"
            exit 1
          fi

  cleanup-public-pages-artifacts:
    needs: [resolve, build, deploy]
    # Cleanup must also run when artifact upload succeeds but deployment or
    # live verification fails. Workflow concurrency prevents this job from
    # deleting an artifact belonging to another in-flight Pages run.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove temporary public Pages bulk artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # upload-pages-artifact is necessarily readable while deploy-pages
          # consumes it. Remove every leftover Pages artifact as soon as the
          # deploy attempt finishes, regardless of success. A later scheduled
          # run retries this cleanup if the workflow itself was interrupted.
          artifacts_json=$(
            gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          )
          pages_artifact_ids_json=$(
            jq -ce '
              [map(.artifacts // []) | add | .[]
                | select(.name == "github-pages" and .expired == false)
                | .id]
              | if all(.[]; type == "number") then .
                else error("invalid artifact identity") end
            ' <<<"$artifacts_json"
          )
          pages_artifact_count=$(jq -er 'length' <<<"$pages_artifact_ids_json")
          for ((index = 0; index < pages_artifact_count; index++)); do
            artifact_id=$(jq -er ".[${index}]" <<<"$pages_artifact_ids_json")
            if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Refusing to delete unexpected Pages artifact ID: $artifact_id"
              exit 1
            fi
            gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
          remaining_artifacts_json=$(
            gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          )
          remaining_pages_count=$(
            jq -er '
              [map(.artifacts // []) | add | .[]
                | select(.name == "github-pages" and .expired == false)]
              | length
            ' <<<"$remaining_artifacts_json"
          )
          if [ "$remaining_pages_count" -ne 0 ]; then
            echo "::error::Public Pages artifacts remain downloadable after cleanup"
            exit 1
          fi

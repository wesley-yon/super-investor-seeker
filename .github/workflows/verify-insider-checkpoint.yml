name: Verify private insider checkpoint

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published insider checkpoint tag in the private data repository
        required: true
        type: string
      baseline_sha256:
        description: Legacy baseline.json SHA-256; leave empty when using transport_sha256
        required: false
        type: string
      transport_sha256:
        description: Pinned incremental transport descriptor SHA-256; leave empty for a legacy baseline
        required: false
        type: string
      inventory_only:
        description: Restore inventory only; exclude filing documents and original-source audit
        required: false
        default: false
        type: boolean
      source_quarters:
        description: Optional space-separated source quarters (e.g. 2026Q2 2026Q3); requires inventory_only and transport_sha256
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: insider-checkpoint-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment: private-data
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify insider archive implementation
        working-directory: insider
        run: python -m unittest discover -s tests -q

      - name: Authenticate for private archive reads
        id: archive-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_ARCHIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: super-investor-seeker-data
          permission-contents: read

      - name: Download and verify the pinned checkpoint
        working-directory: insider
        env:
          GH_TOKEN: ${{ steps.archive-reader.outputs.token }}
          INSIDER_RELEASE_TAG: ${{ inputs.release_tag }}
          INSIDER_BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
          INSIDER_TRANSPORT_SHA256: ${{ inputs.transport_sha256 }}
          INSIDER_INVENTORY_ONLY: ${{ inputs.inventory_only }}
          INSIDER_SOURCE_QUARTERS: ${{ inputs.source_quarters }}
        run: |
          options=()
          if [[ "$INSIDER_INVENTORY_ONLY" == "true" ]]; then
            options+=(--inventory-only)
          fi
          if [[ -n "$INSIDER_SOURCE_QUARTERS" ]]; then
            if [[ "$INSIDER_INVENTORY_ONLY" != "true" || -z "$INSIDER_TRANSPORT_SHA256" ]]; then
              echo "::error::Selected source quarters require inventory_only and an incremental transport checksum"
              exit 1
            fi
            options+=(--source-quarters "$INSIDER_SOURCE_QUARTERS")
          fi
          if [[ -n "$INSIDER_TRANSPORT_SHA256" ]]; then
            if [[ -n "$INSIDER_BASELINE_SHA256" ]]; then
              echo "::error::Provide exactly one pinned baseline or transport checksum"
              exit 1
            fi
            python -m insider_pipeline.github_chain \
              --tag "$INSIDER_RELEASE_TAG" \
              --transport-sha256 "$INSIDER_TRANSPORT_SHA256" \
              --output "$RUNNER_TEMP/insider-checkpoint" --workers 4 "${options[@]}"
            exit 0
          fi
          if [[ -z "$INSIDER_BASELINE_SHA256" ]]; then
            echo "::error::Provide exactly one pinned baseline or transport checksum"
            exit 1
          fi
          python -m insider_pipeline.github_read \
            --tag "$INSIDER_RELEASE_TAG" \
            --baseline-sha256 "$INSIDER_BASELINE_SHA256" \
            --output "$RUNNER_TEMP/insider-checkpoint" --workers 4 "${options[@]}"

      - name: Record verification summary without raw private data
        env:
          INSIDER_REPORT: ${{ runner.temp }}/insider-checkpoint/cloud-verification.json
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ['INSIDER_REPORT']).read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if report.get('inventory_only_restore_verified'):
                  if report.get('inventory_byte_identical'):
                      summary.write('Private inventory restored byte for byte with read-only access.\n\n')
                  else:
                      summary.write(f"Private inventory restored through {report['checkpoints']} pinned checkpoints; every resulting inventory row verified with read-only access.\n\n")
                  summary.write(f"Queue rows: {report['inventory_filings']:,}; downloaded assets: {report['assets']:,}; bytes: {report['asset_bytes']:,}.\n\n")
                  if report.get('source_cache_verified'):
                      summary.write(f"Selected SEC source files restored and checked against the inventory: {report['selected_source_files_verified']:,}.\n\n")
                      summary.write(f"Quarter ZIPs: {', '.join(report['quarter_zip_keys']) or 'none'}; indexes: {', '.join(report['index_source_keys']) or 'none'}.\n\n")
                  summary.write('Filing documents were not downloaded; original-source audit and collection-resume readiness were not verified.\n\n')
              else:
                  summary.write('Private insider checkpoint verified with read-only access.\n\n')
                  summary.write(f"Collected filings: {report['documents']:,}; full queue: {report['inventory_filings']:,}.\n\n")
                  summary.write(f"Original-source checks: {report['source_checks']:,}.\n\n")
                  if report.get('changed_source_audit_matches_archive'):
                      summary.write(f"Restored {report['checkpoints']} pinned checkpoints; the changed-document audit reproduced exactly across {report['changed_source_checks']:,} checks.\n\n")
                  else:
                      summary.write('The archived full-source audit reproduced exactly.\n\n')
              summary.write('This verification does not complete the backfill or activate daily maintenance.\n')
          PY

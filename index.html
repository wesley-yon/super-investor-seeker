    if (col === sort.col) {
      th.classList.add("active");
      th.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending");
      arr.textContent = sort.dir === "asc" ? "↑" : "↓";
    } else {
      th.classList.remove("active");
      th.setAttribute("aria-sort", "none");
      arr.textContent = "";
    }
  });
}

// Default direction when switching to a new column: text cols → asc, numbers → desc
const DEFAULT_DIR = {
  ticker: "asc", issuer: "asc", name: "asc",
  pct: "desc", prevPct: "desc", pctChg: "desc",
  value: "desc", shares: "desc", qoq: "desc",
};

function onFundSort(col) {
  if (fundSort.col === col) {
    fundSort.dir = fundSort.dir === "asc" ? "desc" : "asc";
  } else {
    fundSort.col = col;
    fundSort.dir = DEFAULT_DIR[col] || "desc";
  }
  curFundRows = sortRows(curFundRows, fundSort.col, fundSort.dir, "fund");
  renderFundTbody();
  updateSortArrows("fundTable", fundSort);
}

function onStockSort(col) {
  if (stockSort.col === col) {
    stockSort.dir = stockSort.dir === "asc" ? "desc" : "asc";
  } else {
    stockSort.col = col;
    stockSort.dir = DEFAULT_DIR[col] || "desc";
  }
  curStockRows = sortRows(curStockRows, stockSort.col, stockSort.dir, "stock");
  stockPage = 1;
  renderStockTbody();
  updateSortArrows("stockTable", stockSort);
}

function setStockPage(page) {
  stockPage = Math.max(1, parseInt(page, 10) || 1);
  renderStockTbody();
}

function setStockRowsPerPage(value) {
  const next = parseInt(value, 10);
  stockRowsPerPage = [15, 25, 50, 100].includes(next) ? next : 15;
  stockPage = 1;
  renderStockTbody();
}

function focusStockSort(col, dir = "desc") {
  stockSort = { col, dir };
  curStockRows = sortRows(curStockRows, col, dir, "stock");
  stockPage = 1;
  renderStockTbody();
  updateSortArrows("stockTable", stockSort);
  const panel = $("stockPanel");
  if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function stockPaginationPages(totalPages, currentPage) {
  if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
  if (currentPage <= 4) return [1, 2, 3, 4, 5, "ellipsis", totalPages];
  if (currentPage >= totalPages - 3) {
    return [1, "ellipsis", totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
  }
  return [1, "ellipsis", currentPage - 1, currentPage, currentPage + 1, "ellipsis", totalPages];
}

// ---------- bootstrap + lazy search index ----------
function normalizeSearchTickers(data) {
  return Array.isArray(data?.tickers)
    ? data.tickers.map(normalizeTickerEntry).filter(Boolean)
    : [];
}

async function fetchBootstrapIndex() {
  try {
    const r = await fetch("data/funds-index.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    assertCompatibleDataContract(data, "data/funds-index.json");
    if (!data || !Array.isArray(data.funds) || data.funds.length === 0) {
      throw new Error("funds-index.json has no funds");
    }
    data.tickers = [];
    return data;
  } catch (error) {
    if (error instanceof DataContractMismatchError) throw error;
    // Safe rollout fallback for a stale Pages deployment or an older checkout.
    console.warn("funds-index.json load failed; falling back to index.json:", error);
    const r = await fetch("data/index.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    assertCompatibleDataContract(data, "data/index.json");
    data.tickers = normalizeSearchTickers(data);
    return data;
  }
}

async function ensureSearchIndex() {
  if (Array.isArray(idx?.tickers) && idx.tickers.length) return idx.tickers;
  if (!searchIndexPromise) {
    searchIndexError = null;
    searchIndexPromise = fetch("data/index.json", { cache: "no-cache" })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        assertCompatibleDataContract(data, "data/index.json");
        const tickers = normalizeSearchTickers(data);
        if (!tickers.length) throw new Error("index.json has no ticker entries");
        idx.tickers = tickers;
        return tickers;
      })
      .catch(error => {
        searchIndexError = error;
        searchIndexPromise = null;
        throw error;
      });
  }
  return searchIndexPromise;
}

function warmSearchIndex() {
  if (Array.isArray(idx?.tickers) && idx.tickers.length) return;
  const load = () => ensureSearchIndex().catch(error => {
    if (!handleDataContractError(error)) {
      console.error("background search index load failed:", error);
    }
  });
  if ("requestIdleCallback" in window) {
    window.requestIdleCallback(load, { timeout: 1500 });
  } else {
    setTimeout(load, 0);
  }
}

function stockIdNeedsSearchIndex(stockId) {
  const parsed = parseStockLookupId(stockId);
  return !/^[A-Z0-9]{9}$/.test(parsed.id_base);
}

// ---------- init ----------
(async function init() {
  try {
    const securityLabelsReady = ensureSecurityLabels();
    idx = await fetchBootstrapIndex();
    if (!idx || !Array.isArray(idx.funds) || idx.funds.length === 0) {
      showEmpty();
      return;
    }
    fundIndexByCik = new Map(
      idx.funds
        .map(fund => [cikKey(fund?.cik), fund])
        .filter(([key]) => key)
    );
    currentReportingQuarter = modalLatestReportingQuarter(idx.funds);
    if (!currentReportingQuarter) {
      throw new Error("funds-index.json has no valid reporting-quarter baseline");
    }
    await securityLabelsReady;
    wireGlobalSearch();
    wireUrlRouting();
    // Fund pages and the home page no longer wait for the full ticker index.
    // Direct ticker hashes resolve through ensureSearchIndex() in loadStock().
    routeFromHash();
    warmSearchIndex();
  } catch (e) {
    if (!handleDataContractError(e)) {
      console.error("bootstrap index load failed:", e);
      showEmpty();
    }
  }
})();

function insiderPreviewEnabled(locationLike = location) {
  const hostname = String(locationLike?.hostname || "").toLowerCase();
  const isLocal = hostname === "localhost"
    || hostname === "127.0.0.1"
    || hostname === "[::1]";
  if (!isLocal) return false;
  const params = new URLSearchParams(String(locationLike?.search || ""));
  return params.get("insiderPreview") === "fixture";
}

// ---------- URL routing ----------
// Hash-based routing: #fund/1067983, #stock/AAPL, or no hash for home.
// We use the URL fragment rather than real paths because GitHub Pages serves
// the same index.html for any path, and real paths would require a 404.html
// redirect trick. The fragment is invisible to the server and lets us route
// client-side cleanly.
function parseAppRoute(hashValue, previewEnabled = insiderPreviewEnabled()) {
  const hash = String(hashValue || "").replace(/^#/, "");
  const fundMatch = hash.match(/^fund\/(.+)$/);
  if (fundMatch) {
    return { kind: "fund", id: fundMatch[1] };
  }
  const stockMatch = hash.match(
    /^stock\/([^/]+)(?:\/(insiders|reporting-insiders))?$/
  );
  if (!stockMatch) return null;
  let id;
  try {
    id = decodeURIComponent(stockMatch[1]);
  } catch (_) {
    return null;
  }
  const requestedView = stockMatch[2] || "holders";
  return {
    kind: "stock",
    id,
    view: requestedView,
  };
}

function wireUrlRouting() {
  // User pressed back/forward, or edited the hash in the URL bar
  window.addEventListener("hashchange", () => routeFromHash());
  window.addEventListener("popstate",   () => routeFromHash());
}

const INSIDER_VIEW_QUERY_KEYS = [
  "range",
  "transactionScope",
  "ownerScope",
  "plan",
  "start",
  "end",
  "search",
  "sort",
  "order",
  "page",
  "filing",
];

function navigationSearch(kind, view) {
  const params = new URLSearchParams(location.search);
  if (kind !== "stock" || view !== "insiders") {
    for (const key of INSIDER_VIEW_QUERY_KEYS) params.delete(key);
  }
  const query = params.toString();
  return query ? `?${query}` : "";
}

function routeFromHash() {
  if (dataContractBlocked) {
    showDataMaintenance();
    return;
  }
  const hash = location.hash || "";
  const route = parseAppRoute(hash);
  if (!route) {
    // No hash → home. Don't push another history entry for this (it's the
    // current URL already).
    goHome({ updateUrl: false });
    return;
  }
  if (route.kind === "fund") {
    const cik = parseInt(route.id, 10);
    if (Number.isFinite(cik)) loadFund(cik, { updateUrl: false });
    else goHome({ updateUrl: false });
  } else if (route.kind === "stock") {
    loadStock(route.id, { updateUrl: false, view: route.view });
  }
}

function setUrl(kind, id, view = "holders") {
  // Push a new history entry so browser back works. replaceState would
  // swallow the previous entry, which is wrong semantically.
  const stockSuffix = kind === "stock"
    && ["insiders", "reporting-insiders"].includes(view)
    ? `/${view}`
    : "";
  const newHash = kind === "home"
    ? ""
    : `#${kind}/${encodeURIComponent(id)}${stockSuffix}`;
  const newUrl = location.pathname + navigationSearch(kind, view) + newHash;
  if (location.pathname + location.search + (location.hash || "") !== newUrl) {
    history.pushState({ kind, id, view }, "", newUrl);
  }
}

// ---------- curated browse lookups ----------
// Run once per index load; results are cached so home-page renders are free.
let _popularFundsCache = null;
function getPopularFunds() {
  if (_popularFundsCache) return _popularFundsCache;
  const out = [];
  const seen = new Set();
  for (const cik of PINNED_POPULAR_FUND_CIKS) {
    const match = idx.funds.find(f => f.cik === cik);
    if (match) {
      out.push(match);
      seen.add(match.cik);
    }
  }
  for (const needle of POPULAR_FUND_NEEDLES) {
    const match = idx.funds.find(
      f => !seen.has(f.cik) && (f.name || "").toUpperCase().includes(needle)
    );
    if (match) {
      out.push(match);
      seen.add(match.cik);
    }
    if (out.length >= 24) break;
  }
  _popularFundsCache = out;
  return out;
}

// ---------- global unified search ----------
// Header search that finds both funds and tickers in one dropdown. Debounced
// input, click-to-navigate, Enter picks the first result, Escape closes,
// outside click closes.
function wireGlobalSearch() {
  const inp = $("gsearch");
  const results = $("gsearchResults");
  if (!inp || !results) return;
  wireDataActions();

  inp.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => globalSearch(inp.value), 150);
  });

  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = results.querySelector(".gsearch-item");
      if (first) first.click();
    } else if (e.key === "Escape") {
      closeGlobalSearch();
      inp.blur();
    }
  });

  // Outside click closes the dropdown
  document.addEventListener("click", (e) => {
    if (!inp.parentElement.contains(e.target)) closeGlobalSearch();
  });

  // Auto-focus: typing anywhere focuses the visible search input
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length !== 1 || /^\s$/.test(e.key)) return;
    const active = document.activeElement;
    if (active && (
      ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(active.tagName)
      || active.isContentEditable
    )) return;
    // Find the first visible search input on the page
    for (const el of document.querySelectorAll(".search-bar input, .gsearch-input")) {
      if (el.offsetParent !== null) { el.focus(); return; }
    }
  });
}

function closeGlobalSearch() {
  document.querySelectorAll(".gsearch-results").forEach(el => {
    el.classList.remove("open");
    el.innerHTML = "";
  });
}

function clearAllSearchInputs() {
  document.querySelectorAll(".search-bar input, .gsearch-input").forEach(el => { el.value = ""; });
  closeGlobalSearch();
}

function getVisibleResults() {
  for (const el of document.querySelectorAll(".gsearch-results")) {
    if (el.offsetParent !== null || el.parentElement?.offsetParent !== null) return el;
  }
  return $("gsearchResults");
}

function currentSearchQueryMatches(q) {
  return Array.from(document.querySelectorAll(".search-bar input, .gsearch-input"))
    .some(el => (el.value || "").trim().toUpperCase() === q);
}

function globalSearch(q) {
  const results = getVisibleResults();
  if (!results) return;
  q = (q || "").trim().toUpperCase();
  if (!q) { closeGlobalSearch(); return; }

  // Fund matching is available from the lightweight bootstrap immediately.
  const fundMatches = [];
  for (const f of idx.funds) {
    if ((f.name || "").toUpperCase().includes(q)) {
      fundMatches.push(f);
      if (fundMatches.length >= 8) break;
    }
  }
  const fundBlock = fundMatches.length ? `
    <div class="gsearch-section">Funds</div>
    ${fundMatches.map(f => `
      <button type="button" class="gsearch-item" data-action="load-fund" data-fund-cik="${esc(f.cik)}">
        <span class="gsearch-tag fund">FUND</span>
        <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(fundSearchIdentity(f))}</span>
      </button>
    `).join("")}` : "";

  // The larger ticker index warms after first paint. If a visitor searches
  // before it is ready, show fund results now and refresh this same query once
  // stock search becomes available.
  if (!Array.isArray(idx.tickers) || idx.tickers.length === 0) {
    const stockStatus = searchIndexError
      ? "Stock search is temporarily unavailable."
      : "Loading stock search…";
    results.innerHTML = fundBlock + `<div class="gsearch-empty">${stockStatus}</div>`;
    results.classList.add("open");
    if (!searchIndexError) {
      ensureSearchIndex()
        .then(() => {
          if (currentSearchQueryMatches(q)) globalSearch(q);
        })
        .catch(error => {
          if (handleDataContractError(error)) return;
          console.error("search index load failed:", error);
          if (currentSearchQueryMatches(q)) globalSearch(q);
        });
    }
    return;
  }

  // Tickers: surface common equities plus ticker-based funds and ETNs.
  // Options and non-common capital-structure rows remain reachable from fund
  // pages, but showing them here is noisy for the primary search workflow.
  const tickerMatches = [];
  for (const entry of idx.tickers) {
    if (!isCommonStockSearchEntry(entry)) continue;
    const symbol = tickerSearchSymbol(entry).toUpperCase();
    const productName = securityProductNameForCusip(entry.cusip).toUpperCase();
    if (!symbol) continue;
    if (symbol === q) tickerMatches.push({ ...entry, _matchRank: 0 });
    else if (symbol.startsWith(q)) tickerMatches.push({ ...entry, _matchRank: 1 });
    else if (symbol.includes(q)) tickerMatches.push({ ...entry, _matchRank: 2 });
    else if (productName.includes(q)) tickerMatches.push({ ...entry, _matchRank: 3 });
  }
  tickerMatches.sort(compareTickerMatch);
  const topTickerMatches = dedupeVisuallyIdenticalTickerMatches(
    tickerMatches
  ).slice(0, 8);

  if (!topTickerMatches.length && !fundMatches.length) {
    results.innerHTML = `<div class="gsearch-empty">No matches for "${esc(q)}"</div>`;
    results.classList.add("open");
    return;
  }

  const tickerBlock = topTickerMatches.length ? `
    <div class="gsearch-section">Tickers</div>
    ${topTickerMatches.map(t => `
      <button type="button" class="gsearch-item" data-action="load-stock" data-stock-id="${esc(t.stock_id || t.ticker)}">
        <span class="gsearch-tag ${esc(searchEntryTagClass(t))}">${esc(searchEntryTagLabel(t))}</span>
        <span style="min-width:0;display:flex;flex-direction:column">
          <span class="mono" style="font-weight:700;color:var(--ac)">${esc(tickerSearchSymbol(t))}</span>
          <span title="${esc(displayIssuer(holdingDisplayCompany(t) || t.cusip || t.stock_id))}" style="font-size:12px;color:var(--mt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(displayIssuer(holdingDisplayCompany(t) || t.cusip || t.stock_id))}</span>
        </span>
      </button>
    `).join("")}` : "";

  // Exact ticker hits lead; otherwise funds lead.
  const tickersFirst = topTickerMatches.some(t => t._matchRank === 0);
  results.innerHTML = tickersFirst ? tickerBlock + fundBlock : fundBlock + tickerBlock;
  results.classList.add("open");
}

// ---------- FUND: detail ----------
async function loadFund(cik, opts = {}) {
  const requestToken = ++insiderViewRequestToken;
  if (!enterDetailView("fund", cik, opts)) return;
  const securityLabelsReady = ensureSecurityLabels();
  const fund = await loadCachedJson({
    cache: fundCache,
    cacheKey: cik,
    url: `data/funds/${cik}.json`,
    loadingMessage: `Loading fund ${cik}...`,
    errorTitle: `Couldn't load fund ${cik}`,
    errorPath: `data/funds/${cik}.json`,
    logLabel: "fund",
  });
  if (requestToken !== insiderViewRequestToken) return;
  await securityLabelsReady;
  if (requestToken !== insiderViewRequestToken) return;
  if (dataContractBlocked) {
    showDataMaintenance();
    return;
  }
  if (!fund) return;
  renderFund(fund);
}

function renderFund(f) {
  $("backBtn").style.display = "block";
  fundHoldingsFilter = "";

  const fundIndexEntry = fundIndexByCik.get(cikKey(f.cik));
  const filingState = fundIndexFilingState(
    fundIndexEntry,
    currentReportingQuarter
  );
  let fundStatusNotice = "";
  if (filingState.state === "WITHHELD") {
    const withheldDate = filingState.withheld?.reportDate;
    fundStatusNotice = `
      <div class="info-note"><strong>Newer filing data is withheld from current statistics.</strong>
      ${withheldDate ? `The unresolved filing reports through ${esc(displayDate(withheldDate))}. ` : ""}
      Holdings shown below are the last published snapshot and remain excluded from sitewide current-holder totals until validation succeeds.</div>`;
  } else if (filingState.state === "STALE") {
    fundStatusNotice = `
      <div class="info-note"><strong>Stale filing snapshot.</strong>
      This manager's latest published quarter is ${esc(quarterCodeLabel(filingState.calendar[0]))}, behind the current site baseline of ${esc(quarterCodeLabel(currentReportingQuarter))}.
      These holdings remain available for historical reference but are excluded from sitewide current-holder totals.</div>`;
  } else if (filingState.state === "UNKNOWN") {
    fundStatusNotice = `
      <div class="info-note"><strong>Reporting status could not be verified.</strong>
      This fund's filing calendar is missing or invalid, so its holdings are excluded from sitewide current-holder totals.</div>`;
  }
  if (
    filingState.state !== "WITHHELD" &&
    filingState.unverifiedReportDates.length
  ) {
    fundStatusNotice += `
      <div class="info-note"><strong>Some historical filing data is unverified.</strong>
      Quarter-over-quarter changes and 4Q trends crossing ${esc(filingState.unverifiedReportDates.map(displayDate).join(", "))} are hidden until SEC replay succeeds. Current verified holdings remain available.</div>`;
  }

  const rawQuarters = Array.isArray(f.quarters) ? f.quarters : [];
  if (!rawQuarters.length) {
    app().innerHTML = `
      <div style="margin-bottom:20px">
        <h2>${esc(displayFundName(f.name || ""))}</h2>
        <span class="mono" style="color:var(--mt);font-size:13px">CIK ${esc(f.cik)}</span>
      </div>
      ${fundStatusNotice}
      <div class="info-note">No quarter data available for this fund yet.</div>`;
    return;
  }

  // Canonicalize duplicate instrument rows before every comparison. All fund
  // page counts, changes, exits, and trends then share the same position key.
  const quarters = rawQuarters
    .slice(0, 4)
    .map(q => ({
      ...q,
      holdings: groupHoldingsByKey(q.holdings),
    }));

  // Pipeline emits quarters newest-first; reverse for chart axis (oldest-first)
  const cur = quarters[0];
  const priorCandidate = quarters[1] || null;
  const comparisonsVerified = filingState.state !== "UNKNOWN";
  const unverifiedReportDates = new Set(
    filingState.unverifiedReportDates
  );
  const prev = comparisonsVerified &&
    priorCandidate &&
    areAdjacentReportDates(cur.report_date, priorCandidate.report_date) &&
    !unverifiedReportDates.has(cur.report_date) &&
    !unverifiedReportDates.has(priorCandidate.report_date)
    ? priorCandidate
    : null;
  const quartersAsc = [...quarters].reverse();
  const contiguousQuarterHistory = comparisonsVerified &&
    quarters.every(
    (q, i) => i === 0 ||
      areAdjacentReportDates(quarters[i - 1].report_date, q.report_date)
  ) && quarters.every(
    q => !unverifiedReportDates.has(q.report_date)
  );

  // Build per-security history across filings for changes and sparklines.
  const hh = {}; // key -> { ticker, issuer, cusip, history: {date: {shares,value}} }
  quarters.forEach(q => {
    (q.holdings || []).forEach(h => {
      const key = holdingHistoryKey(h);
      if (!hh[key]) {
        hh[key] = {
          ticker: h.ticker,
          issuer: h.issuer,
          cusip: h.cusip,
          holding_type: h.holding_type,
          option_type: h.option_type,
          history: {},
        };
      }
      hh[key].history[q.report_date] = {
        date: q.report_date,
        shares: h.shares || 0,
        value: h.value || 0,
        shares_imputed: h.shares_imputed === true,
      };
    });
  });

  // Enrich current quarter's holdings
  const enriched = (cur.holdings || []).map(h => {
    const key = holdingHistoryKey(h);
    const hist = hh[key] || { history: {} };
    const prevRec = prev ? hist.history[prev.report_date] : null;
    const pct = cur.total_value > 0 ? (h.value / cur.total_value) * 100 : 0;
    const prevPct = (prevRec && prev && prev.total_value > 0)
      ? (prevRec.value / prev.total_value) * 100
      : 0;

    // Use the same independently proven, exact-date split adjustment that is
    // published on stock pages. The bootstrap map avoids one network request
    // per holding while keeping unproven corporate actions fail-closed.
    const splitFactor = provenSplitFactorForPeriod(
      idx?.proven_split_adjustments?.[key],
      prev?.report_date,
      cur.report_date
    );
    const ch = prev
      ? positionChange(h, prevRec, { splitFactor })
      : null;

    const shareHistory = quartersAsc.map(
      q => hist.history[q.report_date] || null
    );
    const sparkData = contiguousQuarterHistory &&
      shareTrendIsComparable(
        shareHistory,
        idx?.proven_split_adjustments?.[key]
      )
      ? shareHistory.map(record => record.shares)
      : [];
    return { ...h, pct, prevPct, ch, sparkData, _key: key };
  });
  enriched.sort((a, b) => (b.value || 0) - (a.value || 0));

  // A position present in the immediately prior published filing but absent
  // from the latest one is an exit. Keep these rows separate so they cannot
  // leak into current position counts, values, or concentration statistics.
  const currentKeys = new Set((cur.holdings || []).map(holdingHistoryKey));
  const exited = prev
    ? (prev.holdings || [])
        .filter(h => !currentKeys.has(holdingHistoryKey(h)))
        .map(h => {
          const key = holdingHistoryKey(h);
          const hist = hh[key] || { history: {} };
          const prevPct = prev.total_value > 0 ? ((h.value || 0) / prev.total_value) * 100 : 0;
          const shareHistory = quartersAsc.map(
            q => hist.history[q.report_date] || null
          );
          return {
            ...h,
            pct: 0,
            prevPct,
            ch: positionChange(null, h),
            sparkData: contiguousQuarterHistory &&
              shareTrendIsComparable(
                shareHistory,
                idx?.proven_split_adjustments?.[key]
              )
              ? shareHistory.map(record => record.shares)
              : [],
            exitReportDate: cur.report_date,
            _key: key,
          };
        })
        .sort((a, b) => (b.value || 0) - (a.value || 0))
    : [];

  const top5 = enriched.slice(0, 5);
  const top5Pct = top5.reduce((sum, h) => sum + (h.pct || 0), 0);
  const top = top5[0] || null;
  const valuesAsc = contiguousQuarterHistory
    ? quartersAsc.map(q => q.total_value || 0)
    : [];
  const positionsAsc = contiguousQuarterHistory
    ? quartersAsc.map(q => (q.holdings || []).length)
    : [];
  const largestIncrease = enriched.filter(h => h.ch?.t === "UP")
    .sort((a, b) => (b.ch.p || 0) - (a.ch.p || 0))[0];
  const largestReduction = [
    ...enriched.filter(h => h.ch?.t === "DOWN"),
    ...exited,
  ].sort((a, b) =>
    ((b.ch?.p || 0) - (a.ch?.p || 0)) ||
    ((b.value || 0) - (a.value || 0))
  )[0];
  const newPositions = enriched.filter(h => h.ch?.t === "NEW").slice(0, 5);
  const reducedPositions = enriched.filter(h => h.ch?.t === "DOWN").slice(0, 8);

  // Save the enriched rows into outer scope so header clicks can re-sort
  // without needing to re-run the whole fund-enrichment pipeline.
  curFundRows = sortRows(enriched, fundSort.col, fundSort.dir, "fund");
  const sec13fUrl = sec13fFilingsUrl(f);
  const fundExitRows = exited.map((h, i) => {
    const ht = holdingPublishedInstrumentType(h);
    const displayLabel = fundTicker(h);
    const companyName = displayIssuer(holdingDisplayCompany(h)) || "—";
    const lookupId = stockLookupId(h.cusip || h.ticker, ht);
    const securityCell = lookupId
      ? `<td class="mono col-sticky security-label-cell" style="white-space:nowrap"><button type="button" class="table-action security-label-action" data-action="load-stock" data-stock-id="${esc(lookupId)}">${esc(displayLabel)}</button></td>`
      : `<td class="mono col-sticky security-label-cell" style="color:var(--mt);font-size:11px;white-space:nowrap">${esc(displayLabel)}</td>`;
    return `<tr>
      <td class="mono col-rank" style="text-align:center;color:var(--mt);font-size:11px">${i + 1}</td>
      ${securityCell}
      <td title="${esc(companyName)}" style="font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(companyName)}</td>
      <td class="mono" style="text-align:right;color:var(--mt)">${fP(h.prevPct)}</td>

    </tr>`;
  }).join("");
  const fundExitPanel = prev ? `
        <section class="fund-panel exit-panel">
          <div class="fund-panel-head">

          </div>
          <div class="tbl-wrap"><table id="fundExitTable"><thead><tr style="background:var(--sf)">
            <th class="col-rank" style="text-align:center;width:36px">#</th>
            <th class="col-sticky" style="text-align:left;background:var(--sf)">Security</th>
            <th style="text-align:left">Company</th>
            <th style="text-align:right">Prior %</th>
            <th style="text-align:right">Prior Value</th>
            <th style="text-align:right">Prior Shares</th>
            <th style="text-align:center">Change</th>
            <th style="text-align:center">Trend (4Q)</th>
            <th style="text-align:left">Type</th>
          </tr></thead><tbody>${fundExitRows || `<tr><td colspan="9" style="text-align:center;color:var(--mt);padding:30px">No positions exited in this filing.</td></tr>`}</tbody></table></div>
          <div class="fund-foot">Compared with the immediately prior published filing (${esc(displayDate(prev.report_date))}). Prior values are shown for context and are not included in current totals.</div>
        </section>` : "";

  let html = `
    <div class="fund-page">
      <main class="fund-main">
        <div class="fund-title">
          <h1>${esc(displayFundName(f.name || ""))}</h1>
          <div class="fund-meta">
            <span>CIK ${esc(f.cik)}</span>

            <span>Filed ${esc(displayDate(cur.filing_date))}</span>
            <span>Quarterly 13F</span>
            ${sec13fUrl ? `<span><a href="${esc(sec13fUrl)}" target="_blank" rel="noopener noreferrer">View SEC 13F filings ↗</a></span>` : ""}
          </div>
        </div>

        ${fundStatusNotice}
        <div class="fund-stat-grid">
          <div class="fund-stat">
            <div>
              <div class="fund-stat-label">13F Equity Value</div>
              <div class="fund-stat-value mono">${fV(cur.total_value)}</div>

          </div>
          <div class="fund-stat">
            <div>
              <div class="fund-stat-label">Positions</div>

            </div>
            ${miniBars(positionsAsc)}
          </div>
          <div class="fund-stat">
            <div class="top-position-copy">

            </div>
          </div>
          <div class="fund-stat">
            <div>

            </div>
          </div>
          <div class="tbl-wrap"><table id="fundTable"><thead><tr style="background:var(--sf)">
            <th class="col-rank" style="text-align:center;width:36px">#</th>
            <th scope="col" class="sort col-sticky" data-col="ticker" aria-sort="none" style="text-align:left;background:var(--sf)"><button type="button" class="sort-button" aria-label="Sort by Security" onclick="onFundSort('ticker')">Security<span class="arr" aria-hidden="true"></span></button></th>
            ${sortableHeader("onFundSort", "issuer", "Company", "left")}
            ${sortableHeader("onFundSort", "pct", "% Portfolio", "right")}

          <div class="summary-label">Positions Exited</div>
          <div class="summary-list">${exited.length ? exited.slice(0, 8).map(h => `<span class="summary-exit">${esc(fundTicker(h))}</span>`).join(", ") : "No exited positions"}</div>

  app().innerHTML = html;

function renderFundTbody() {
  // Called on initial render AND on every header click to re-sort. Reads
  // curFundRows (already sorted by the caller) and writes #fundTbody.
  const tbody = $("fundTbody");
  if (!tbody) return;
  const needle = fundHoldingsFilter.trim().toUpperCase();
  const visibleRows = needle
    ? curFundRows.filter(h => {
        const haystack = `${fundTicker(h)} ${h.ticker || ""} ${holdingDisplayCompany(h)} ${h.issuer || ""} ${h.class || ""} ${h.cusip || ""}`.toUpperCase();
        return haystack.includes(needle);
      })
    : curFundRows;

  const rows = visibleRows.map((h, i) => {
    const ht = holdingPublishedInstrumentType(h);
    const rowBg = i%2 ? "var(--sf)" : "#06101a";
    const displayLabel = fundTicker(h);
    const companyName = displayIssuer(holdingDisplayCompany(h)) || "—";
    const lookupId = stockLookupId(h.cusip || h.ticker, ht);
    const securityCell = lookupId
      ? `<td class="mono col-sticky security-label-cell" style="background:${rowBg};white-space:nowrap"><button type="button" class="table-action security-label-action" data-action="load-stock" data-stock-id="${esc(lookupId)}">${esc(displayLabel)}</button></td>`
      : `<td class="mono col-sticky security-label-cell" style="color:var(--mt);font-size:11px;background:${rowBg};white-space:nowrap">${esc(displayLabel)}</td>`;
    return `<tr style="background:${i%2 ? "var(--sf)" : "transparent"}">
      <td class="mono col-rank" style="text-align:center;color:var(--mt);font-size:11px">${i+1}</td>
      ${securityCell}
      <td title="${esc(companyName)}" style="font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(companyName)}</td>
      <td class="mono" style="text-align:right;color:${h.pct >= 5 ? "var(--ac)" : "var(--mt)"}">${fP(h.pct)}</td>
      <td class="mono" style="text-align:right;font-weight:600">${fV(h.value)}</td>
      <td class="mono" style="text-align:right">${formatShares(h.shares, h.shares_imputed)}</td>
      <td class="mono ${esc(changeClass(h.ch))}" style="text-align:center;font-weight:800">${esc(changeText(h.ch))}</td>
      <td class="mono" style="text-align:right;color:var(--mt)">${h.prevPct > 0 ? fP(h.prevPct) : "—"}</td>
      <td style="text-align:center">${spark(h.sparkData)}</td>
      <td style="color:var(--tx);white-space:nowrap">${esc(holdingDisplayKindLabel(h))}</td>
    </tr>`;
  }).join("");
  tbody.innerHTML = rows || `<tr><td colspan="10" style="text-align:center;color:var(--mt);padding:34px">No holdings match this search.</td></tr>`;
  const foot = $("fundFoot");
  if (foot) {
    const total = curFundRows.length.toLocaleString();
    const shown = visibleRows.length.toLocaleString();
    foot.textContent = needle ? `${shown} of ${total} positions shown` : `${total} positions total`;
  }
}

function safeSecDocumentUrl(value) {
  try {
    const url = new URL(String(value || ""));
    const hostname = url.hostname.toLowerCase();
    const isSecHost = hostname === "sec.gov" || hostname.endsWith(".sec.gov");
    if (
      url.protocol !== "https:"
      || !isSecHost
      || url.username
      || url.password
      || url.port
    ) return "";
    return url.href;
  } catch (_error) {
    return "";
  }
}

function safeInsiderAccession(value) {
  const accession = String(value || "").trim();
  return /^\d{10}-\d{2}-\d{6}$/.test(accession) ? accession : "";
}

const DELEGATED_STOCK_VIEWS = Object.freeze([
  "holders",
  "insiders",
  "reporting-insiders",
]);

function resolveDelegatedStockId(stockId) {
  const canonicalId = canonicalStockLookupId(stockId);
  const stockEntry = resolveStockEntry(canonicalId);
  return stockEntry ? stockEntry.stock_id : "";
}

function wireDataActions() {
  if (document.documentElement.dataset.dataActionsWired) return;
  document.documentElement.dataset.dataActionsWired = "true";
  document.addEventListener("click", event => {
    const trigger = event.target.closest("[data-action]");
    if (!trigger) return;
    const action = trigger.dataset.action;
    const stockId = String(trigger.dataset.stockId || "");
    const view = String(trigger.dataset.stockView || "");
    if (action === "load-fund") {
      const cik = String(trigger.dataset.fundCik || "").trim();
      if (/^\d{1,10}$/.test(cik)) loadFund(cik);
      closeGlobalSearch();
      return;
    }
    const isStockAction = [
      "load-stock",
      "holders-insider-preview",
      "load-stock-view",
      "retry-insider-view",
    ].includes(action);
    let resolvedStockId = "";
    if (isStockAction) {
      resolvedStockId = resolveDelegatedStockId(stockId);
      if (!resolvedStockId) return;
    }
    if (action === "load-stock") {
      loadStock(resolvedStockId);
      closeGlobalSearch();
      return;
    }
    if (action === "holders-insider-preview") {
      if (insiderPreviewEnabled()) {
        setInsiderQuery({ start: "2026-04-01", end: "2026-06-30", range: "6m" });
      } else {
        setInsiderQuery({ start: null, end: null, range: "90d" });
      }
      loadStock(resolvedStockId, { view: "insiders" });
      return;
    }
    if (
      ["load-stock-view", "retry-insider-view"].includes(action)
      && DELEGATED_STOCK_VIEWS.includes(view)
    ) loadStock(resolvedStockId, { view });
  });
}

function exactWholeDisplay(value) {
  const raw = String(value ?? "").trim();
  if (!raw) return "—";
  const match = raw.match(/^(-?)(\d+)(?:\.(\d+))?$/);
  if (!match) return raw;
  const integer = match[2].replace(/^0+(?=\d)/, "");
  const fraction = String(match[3] || "").replace(/0+$/, "");
  const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return `${match[1]}${grouped}${fraction ? `.${fraction}` : ""}`;
}

function fractionPercentDisplay(value, digits = 0) {
  const match = String(value ?? "").match(/^(\d+)(?:\.(\d+))?$/);
  if (!match) return "Unknown";
  const fraction = String(match[2] || "");
  const rawDigits = `${match[1]}${fraction}`;
  const scale = 10n ** BigInt(fraction.length);
  const outputScale = 10n ** BigInt(digits);
  const numerator = BigInt(rawDigits) * 100n * outputScale;
  const rounded = (numerator + (scale / 2n)) / scale;
  const text = rounded.toString().padStart(digits + 1, "0");
  return digits
    ? `${text.slice(0, -digits)}.${text.slice(-digits)}%`
    : `${text}%`;
}

function fixtureDecimal(value) {
  const match = String(value ?? "").trim().match(/^(-?)(\d+)(?:\.(\d+))?$/);
  if (!match) return null;
  const fraction = match[3] || "";
  const magnitude = BigInt(`${match[2]}${fraction}`);
  return {
    units: match[1] ? -magnitude : magnitude,
    scale: fraction.length,
  };
}

function fixtureDecimalText(decimal) {
  if (!decimal) return null;
  const negative = decimal.units < 0n;
  const magnitude = (negative ? -decimal.units : decimal.units)
    .toString()
    .padStart(decimal.scale + 1, "0");
  const whole = decimal.scale ? magnitude.slice(0, -decimal.scale) : magnitude;
  const fraction = decimal.scale
    ? magnitude.slice(-decimal.scale).replace(/0+$/, "")
    : "";
  return `${negative ? "-" : ""}${whole}${fraction ? `.${fraction}` : ""}`;
}

function sumFixtureDecimals(values) {
  const parsed = values.map(fixtureDecimal).filter(Boolean);
  const scale = parsed.reduce((maximum, value) => Math.max(maximum, value.scale), 0);
  const units = parsed.reduce(
    (total, value) => total + value.units * (10n ** BigInt(scale - value.scale)),
    0n
  );
  return { units, scale };
}

function fixtureDecimalDifference(left, right) {
  const [a, b] = [fixtureDecimal(left), fixtureDecimal(right)];
  if (!a || !b) return null;
  const scale = Math.max(a.scale, b.scale);
  return {
    units:
      a.units * (10n ** BigInt(scale - a.scale))
      - b.units * (10n ** BigInt(scale - b.scale)),
    scale,
  };
}

function compareFixtureDecimals(left, right) {
  const difference = fixtureDecimalDifference(left, right);
  if (!difference) return 0;
  return difference.units < 0n ? -1 : difference.units > 0n ? 1 : 0;
}

function fixtureDecimalRatio(numerator, denominator, digits = 6) {
  const [top, bottom] = [fixtureDecimal(numerator), fixtureDecimal(denominator)];
  if (!top || !bottom || bottom.units === 0n) return null;
  const scale = Math.max(top.scale, bottom.scale);
  const alignedTop = top.units * (10n ** BigInt(scale - top.scale));
  const alignedBottom = bottom.units * (10n ** BigInt(scale - bottom.scale));
  const negative = (alignedTop < 0n) !== (alignedBottom < 0n);
  const absoluteTop = alignedTop < 0n ? -alignedTop : alignedTop;
  const absoluteBottom = alignedBottom < 0n ? -alignedBottom : alignedBottom;
  const outputScale = 10n ** BigInt(digits);
  const rounded = (absoluteTop * outputScale + absoluteBottom / 2n) / absoluteBottom;
  return fixtureDecimalText({
    units: negative ? -rounded : rounded,
    scale: digits,
  });
}

function compactFixtureMoney(value) {
  const raw = String(value ?? "");
  const match = raw.match(/^(-?)(\d+)(?:\.(\d+))?$/);
  if (!match) return raw || "—";
  const sign = match[1] ? "-" : "";
  const integer = match[2].replace(/^0+(?=\d)/, "");
  const units = [
    [10, "B"],
    [7, "M"],
    [4, "K"],
  ];
  const unit = units.find(([length]) => integer.length >= length);
  if (!unit) return `${sign}$${exactWholeDisplay(`${integer}${match[3] ? `.${match[3]}` : ""}`)}`;
  const [length, suffix] = unit;
  const places = length - 1;
  const whole = integer.slice(0, integer.length - places);
  const remainder = integer.slice(integer.length - places).padEnd(places, "0");
  const decimals = remainder.slice(0, 2).replace(/0+$/, "");
  return `${sign}$${whole}${decimals ? `.${decimals}` : ""}${suffix}`;
}

function compactLiveInsiderMoney(value) {
  const decimal = fixtureDecimal(value);
  if (!decimal) return value == null ? "—" : String(value);
  const negative = decimal.units < 0n;
  const absoluteUnits = negative ? -decimal.units : decimal.units;
  const scale = 10n ** BigInt(decimal.scale);
  const units = [
    [1000000000n, "B"],
    [1000000n, "M"],
    [1000n, "K"],
  ];
  const compact = units.find(([threshold]) => absoluteUnits >= threshold * scale);
  if (!compact) {
    return `${negative ? "-" : ""}$${exactWholeDisplay(
      fixtureDecimalText({ units: absoluteUnits, scale: decimal.scale })
    )}`;
  }
  const [threshold, suffix] = compact;
  const denominator = threshold * scale;
  const hundredths = (absoluteUnits * 100n + denominator / 2n) / denominator;
  const whole = hundredths / 100n;
  const fraction = (hundredths % 100n).toString().padStart(2, "0")
    .replace(/0+$/, "");
  return `${negative ? "-" : ""}$${whole}${fraction ? `.${fraction}` : ""}${suffix}`;
}

function insiderMoneyDisplay(value) {
  return currentInsiderPayloadMode === "live"
    ? compactLiveInsiderMoney(value)
    : compactFixtureMoney(value);
}

function liveInsiderNetDirectionLabel(direction) {

function validFixtureIsoDate(value) {
  const text = String(value || "").trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return "";
  const date = new Date(`${text}T00:00:00Z`);
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === text
    ? text
    : "";
}

function shiftFixtureIsoMonths(value, months) {
  const valid = validFixtureIsoDate(value);
  if (!valid) return "";
  const [year, month, day] = valid.split("-").map(Number);
  const shifted = new Date(Date.UTC(year, month - 1, 1));
  shifted.setUTCMonth(shifted.getUTCMonth() + months);
  const lastDay = new Date(Date.UTC(
    shifted.getUTCFullYear(),
    shifted.getUTCMonth() + 1,
    0
  )).getUTCDate();
  shifted.setUTCDate(Math.min(day, lastDay));
  return shifted.toISOString().slice(0, 10);
}

function insiderEffectiveDateWindow(fixture, state) {
  let explicitStart = validFixtureIsoDate(state.start);
  let explicitEnd = validFixtureIsoDate(state.end);
  if (explicitStart && explicitEnd && explicitStart > explicitEnd) {
    [explicitStart, explicitEnd] = [explicitEnd, explicitStart];
  }
  if (explicitStart || explicitEnd) {
    return { start: explicitStart, end: explicitEnd, explicit: true };
  }
  if (state.range === "all") return { start: "", end: "", explicit: false };
  const fallbackTransactionDate = (fixture.transactions?.items || [])
    .map(item => validFixtureIsoDate(item.transactionDate))
    .filter(Boolean)
    .sort()
    .at(-1) || "";
  const end = [
    fixture.priceSeries?.at(-1)?.date,
    fixture.dataFreshness?.latestPriceDate,
    String(fixture.asOf || "").slice(0, 10),
  ].map(validFixtureIsoDate).find(Boolean) || fallbackTransactionDate;
  const months = { "90d": 3, "6m": 6, "1y": 12, "2y": 24, "5y": 60 }[state.range];
  return {
    start: end && months ? shiftFixtureIsoMonths(end, -months) : "",
    end,
    explicit: false,
  };
}

function insiderFixturePathForStock(stockId, stockMeta = {}) {
  if (!insiderPreviewEnabled()) return null;
  // loadStock passes its resolved canonical security ID. Fixture routing is
  // deliberately CUSIP-only: ticker and issuer strings are display aliases.
  const canonicalId = String(stockId || "").trim().toUpperCase();
  const metadataIds = [stockMeta.stock_id, stockMeta.cusip]
    .map(value => String(value || "").trim().toUpperCase())
    .filter(Boolean);
  if (
    canonicalId !== "03770N101"
    || metadataIds.some(identity => identity !== "03770N101")
  ) return null;
  return INSIDER_FIXTURE_PATH;
}

function insiderQueryState(fixture) {
  const defaults = fixture?.filters || {};
  const params = new URLSearchParams(location.search);
  const allow = (key, values, fallback) => {
    const value = params.get(key);
    return values.includes(value) ? value : fallback;
  };
  let start = validFixtureIsoDate(params.get("start"));
  let end = validFixtureIsoDate(params.get("end"));
  if (start && end && start > end) [start, end] = [end, start];
  const state = {
    range: allow("range", ["90d", "6m", "1y", "2y", "5y", "all"], currentInsiderPayloadMode === "live" ? "1y" : (defaults.range || "1y")),
    transactionScope: allow("transactionScope", ["ps", "all"], currentInsiderPayloadMode === "live" ? "ps" : (defaults.transactionScope || "ps")),
    ownerScope: allow("ownerScope", ["all", "officers-directors", "ten-percent"], defaults.ownerScope || "all"),
    plan: allow("plan", ["all", "10b5-1", "not-10b5-1"], defaults.plan || "all"),
    start,
    end,
    search: params.get("search") || "",
    sort: allow("sort", ["tradeDate", "value", "shares", "holdingsAfter", "percentChange"], defaults.sort || "tradeDate"),
    order: allow("order", ["asc", "desc"], defaults.order || "desc"),
    page: (() => {
      const requested = Number(params.get("page"));
      return Number.isSafeInteger(requested) && requested >= 1 && requested <= 5_000
        ? requested
        : 1;
    })(),
    filing: params.get("filing") || "",
  };
  const dateWindow = insiderEffectiveDateWindow(fixture, state);
  state.dateInputStart = dateWindow.start;
  state.dateInputEnd = dateWindow.end;
  return state;
}

function setInsiderQuery(updates, { replace = false } = {}) {
  const params = new URLSearchParams(location.search);
  const paginationKeys = new Set([
    "range",
    "transactionScope",
    "ownerScope",
    "plan",
    "start",
    "end",
    "search",
    "sort",
    "order",
  ]);
  if (
    !Object.hasOwn(updates, "page")
    && Object.keys(updates).some(key => paginationKeys.has(key))
  ) {
    params.delete("page");
  }
  for (const [key, value] of Object.entries(updates)) {
    if (value == null || value === "") params.delete(key);
    else params.set(key, value);
  }
  const query = params.toString();
  const url = `${location.pathname}${query ? `?${query}` : ""}${location.hash}`;
  history[replace ? "replaceState" : "pushState"]({}, "", url);
  if (currentInsiderFixture) renderCurrentInsiderView();
}

function filteredInsiderTransactions(fixture, state) {
  let rows = [...(fixture.transactions?.items || [])];
  if (state.transactionScope === "ps") {
    rows = rows.filter(item => ["P", "S"].includes(item.transactionCode));
  }
  if (state.ownerScope === "officers-directors") {
    rows = rows.filter(item => !(item.ownerGroup?.roles || []).every(role => role === "TenPercentOwner"));
  } else if (state.ownerScope === "ten-percent") {
    rows = rows.filter(item => (item.ownerGroup?.roles || []).includes("TenPercentOwner"));
  }
  if (state.plan === "10b5-1") {
    rows = rows.filter(item => item.planStatus === "filing_marked");
  } else if (state.plan === "not-10b5-1") {
    rows = rows.filter(item => item.planStatus === "not_marked");
  }
  const dateWindow = insiderEffectiveDateWindow(fixture, state);
  if (dateWindow.start) {
    rows = rows.filter(item => validFixtureIsoDate(item.transactionDate) >= dateWindow.start);
  }
  if (dateWindow.end) {
    rows = rows.filter(item => {
      const date = validFixtureIsoDate(item.transactionDate);
      return date && date <= dateWindow.end;
    });
  }
  const needle = state.search.trim().toUpperCase();
  if (needle) {
    rows = rows.filter(item => `${item.ownerGroup?.displayName || ""} ${item.ownerGroup?.primaryTitle || ""}`.toUpperCase().includes(needle));
  }
  const field = {
    tradeDate: "transactionDate",
    value: "value",
    shares: "shares",
    holdingsAfter: "postTransactionShares",
    percentChange: "percentChange",
  }[state.sort];
  const numeric = state.sort !== "tradeDate";
  rows.sort((a, b) => {
    const left = String(a[field] ?? "");
    const right = String(b[field] ?? "");
    let comparison;
    if (!numeric) comparison = left.localeCompare(right);
    else {
      const normalize = value => {
        const sign = value.startsWith("-") ? -1 : 1;
        const digits = value.replace(/^-/, "").split(".");
        return { sign, whole: digits[0].replace(/^0+/, "") || "0", fraction: digits[1] || "" };
      };
      const x = normalize(left || "0");
      const y = normalize(right || "0");
      if (x.sign !== y.sign) comparison = x.sign - y.sign;
      else if (x.whole.length !== y.whole.length) comparison = (x.whole.length - y.whole.length) * x.sign;
      else comparison = (x.whole.localeCompare(y.whole) || x.fraction.localeCompare(y.fraction)) * x.sign;
    }
    return state.order === "asc" ? comparison : -comparison;
  });
  return rows;
}

function insiderTransactionPage(fixture, rows, state) {
  const configuredPageSize = Number(fixture?.staticPagination?.pageSize);
  const pageSize = Number.isSafeInteger(configuredPageSize)
    && configuredPageSize >= 1
    && configuredPageSize <= 100
    ? configuredPageSize
    : 100;
  const pageCount = Math.max(1, Math.ceil(rows.length / pageSize));
  const page = Math.min(Math.max(1, state.page), pageCount);
  const start = (page - 1) * pageSize;
  const end = Math.min(rows.length, start + pageSize);
  return {
    end,
    items: rows.slice(start, end),
    page,
    pageCount,
    pageSize,
    start,
    total: rows.length,
  };
}

function canonicalizeInsiderPageQuery(page) {
  const params = new URLSearchParams(location.search);
  const requested = params.get("page");
  const canonical = page > 1 ? String(page) : null;
  if (requested === canonical || (requested === null && canonical === null)) return;
  if (canonical === null) params.delete("page");
  else params.set("page", canonical);
  const query = params.toString();
  history.replaceState(
    {},
    "",
    `${location.pathname}${query ? `?${query}` : ""}${location.hash}`
  );
}

function insiderDataFiltersActive(fixture, state) {
  const defaults = fixture.filters || {};
  return (
    state.range !== (defaults.range || "1y")
    || state.transactionScope !== (defaults.transactionScope || "ps")
    || state.ownerScope !== (defaults.ownerScope || "all")
    || state.plan !== (defaults.plan || "all")
    || Boolean(state.start || state.end)
    || state.search.trim() !== String(defaults.search || "").trim()
  );
}

function insiderOwnerKey(item) {
  return item.ownerGroup?.key || item.ownerGroup?.displayName || "";
}

function aggregateFilteredCode(rows, code) {
  const selected = rows.filter(item => item.transactionCode === code);
  const values = selected.map(item => item.value).filter(value => fixtureDecimal(value));
  const value = fixtureDecimalText(sumFixtureDecimals(values));
  return {
    rows: selected,
    value,
    displayValue: selected.length && !values.length ? "—" : insiderMoneyDisplay(value),
    transactionCount: selected.length,
    ownerGroupCount: new Set(selected.map(insiderOwnerKey).filter(Boolean)).size,
    knownValueCount: values.length,
    missingValueCount: selected.length - values.length,
  };
}

function filteredPlanMarkedFraction(sales) {
  const known = sales.filter(
    item => ["filing_marked", "not_marked"].includes(item.planStatus)
      && fixtureDecimal(item.value)
  );
  const knownValue = fixtureDecimalText(sumFixtureDecimals(known.map(item => item.value)));
  if (!known.length || compareFixtureDecimals(knownValue, "0") === 0) return null;
  const markedValue = fixtureDecimalText(sumFixtureDecimals(
    known.filter(item => item.planStatus === "filing_marked").map(item => item.value)
  ));
  return fixtureDecimalRatio(markedValue, knownValue);
}

function rankedFilteredOwners(rows, code) {
  const owners = new Map();
  for (const item of rows.filter(row => row.transactionCode === code)) {
    const key = insiderOwnerKey(item);
    if (!key) continue;
    const owner = owners.get(key) || {
      displayName: item.ownerGroup?.displayName || "—",
      roleLabel: item.ownerGroup?.primaryTitle || "",
      values: [],
      sales: [],
    };
    if (fixtureDecimal(item.value)) owner.values.push(item.value);
    if (code === "S") owner.sales.push(item);
    owners.set(key, owner);
  }
  return [...owners.values()]
    .map(owner => {
      const value = fixtureDecimalText(sumFixtureDecimals(owner.values));
      return {
        ...owner,
        value,
        displayValue: owner.values.length ? insiderMoneyDisplay(value) : "—",
        planMarkedKnownValuePercentage:
          code === "S" ? filteredPlanMarkedFraction(owner.sales) : null,
      };
    })
    .sort((left, right) => compareFixtureDecimals(right.value, left.value))
    .map((owner, index) => ({ ...owner, rank: index + 1 }));
}

function filteredLatestHoldings(rows) {
  const latestByOwner = new Map();
  for (const item of rows) {
    const key = insiderOwnerKey(item);
    if (!key) continue;
    const previous = latestByOwner.get(key);
    const itemOrder = `${item.transactionDate || ""}|${item.acceptedAt || ""}`;
    const previousOrder = previous
      ? `${previous.transactionDate || ""}|${previous.acceptedAt || ""}`
      : "";
    if (!previous || itemOrder > previousOrder) latestByOwner.set(key, item);
  }
  const holdings = [...latestByOwner.values()].map(item => ({
    displayName: item.ownerGroup?.displayName || "—",
    roleLabel: item.ownerGroup?.primaryTitle || "",
    roles: item.ownerGroup?.roles || [],
    shares: item.postTransactionShares,
    ownershipPercentage: null,
  }));
  holdings.sort((left, right) => compareFixtureDecimals(right.shares, left.shares));
  return {
    officersAndDirectors: holdings.filter(item =>
      item.roles.some(role => ["Officer", "Director"].includes(role))
    ),
    tenPercentOwnersAndEntities: holdings.filter(item =>
      item.roles.includes("TenPercentOwner")
    ),
  };
}

function filteredInsiderProjection(fixture, state, rows) {
  if (!insiderDataFiltersActive(fixture, state)) {
    return {
      summary: fixture.summary || {},
      sidebar: fixture.sidebar || {},
    };
  }
  const purchases = aggregateFilteredCode(rows, "P");
  const sales = aggregateFilteredCode(rows, "S");
  const net = fixtureDecimalDifference(purchases.value, sales.value);
  const netValue = fixtureDecimalText(net);
  const latest = rows
    .filter(item => ["P", "S"].includes(item.transactionCode))
    .sort((left, right) =>
      `${right.transactionDate || ""}|${right.acceptedAt || ""}`.localeCompare(
        `${left.transactionDate || ""}|${left.acceptedAt || ""}`
      )
    )[0] || null;
  const ratio = compareFixtureDecimals(purchases.value, "0") === 0
    ? null
    : fixtureDecimalRatio(sales.value, purchases.value, 1);
  const markedSales = sales.rows.filter(item => item.planStatus === "filing_marked");
  const markedSalesValues = markedSales
    .map(item => item.value)
    .filter(value => fixtureDecimal(value));
  const markedSalesValue = fixtureDecimalText(sumFixtureDecimals(
    markedSalesValues
  ));
  const missingValueCount = purchases.missingValueCount + sales.missingValueCount;
  const hasKnownValue = purchases.knownValueCount + sales.knownValueCount > 0;
  const hasUnavailablePSValues = missingValueCount > 0;
  return {
    summary: {
      window: "filtered",
      purchases,
      sales: {
        ...sales,
        planMarkedKnownValuePercentage: filteredPlanMarkedFraction(sales.rows),
      },
      netPS: {
        value: netValue,
        displayValue: hasUnavailablePSValues ? "—" : insiderMoneyDisplay(netValue),
        directionLabel:
          hasUnavailablePSValues
            ? "Value unavailable"
            : net.units < 0n
            ? "Net reported selling"
            : net.units > 0n
              ? "Net reported buying"
              : "Balanced reported activity",
        ratioDisplay:
          hasUnavailablePSValues || !hasKnownValue || ratio == null
            ? ""
            : `Sales/Purchases: ${ratio}x`,
        missingValueCount,
      },
      latestMeaningfulTransaction: latest ? {
        ...latest,
        code: latest.transactionCode,
        displayValue: latest.valueDisplay || insiderMoneyDisplay(latest.value),
        relativeAgeLabel: "filtered view",
      } : null,
    },
    sidebar: {
      window: "filtered",
      topBuyers: rankedFilteredOwners(rows, "P"),
      topSellers: rankedFilteredOwners(rows, "S"),
      latestReportedHoldings: filteredLatestHoldings(rows),
      rule10b51: {
        planMarkedSalesValue: markedSalesValue,
        planMarkedSalesDisplayValue:
          markedSales.length && !markedSalesValues.length
            ? "—"
            : insiderMoneyDisplay(markedSalesValue),
        distinctOwnerGroupCount: new Set(
          markedSales.map(insiderOwnerKey).filter(Boolean)
        ).size,
        missingValueCount: markedSales.length - markedSalesValues.length,
        latestPlanAdoptionDate: null,
      },
    },
  };
}

function insiderTransactionTimelineMarkup(fixture, state, rows) {
  const width = 1030;
  const height = 132;
  const pad = { left: 40, right: 34, top: 20, bottom: 30 };
  const datedRows = rows.filter(item => validFixtureIsoDate(item.transactionDate));
  const timestamps = datedRows.map(item =>
    new Date(`${item.transactionDate}T00:00:00Z`).getTime()
  );
  const minimum = timestamps.length ? Math.min(...timestamps) : 0;
  const maximum = timestamps.length ? Math.max(...timestamps) : minimum;
  const x = date => {
    const value = new Date(`${date}T00:00:00Z`).getTime();
    if (minimum === maximum) return width / 2;
    return pad.left
      + ((value - minimum) / (maximum - minimum))
        * (width - pad.left - pad.right);
  };
  const eventPaths = {
    purchase: [],
    sale: [],
    other: [],
  };
  datedRows.forEach((item, index) => {
    const px = x(item.transactionDate) + ((index % 3) - 1) * 3;
    const isPurchase = item.transactionCode === "P";
    const isSale = item.transactionCode === "S";
    const py = isPurchase ? 47 : isSale ? 85 : 66;
    const size = 7;
    const point = value => Number(value).toFixed(2);
    if (isPurchase) {
      eventPaths.purchase.push(
        `M${point(px)},${point(py-size)} L${point(px-size)},${point(py+size*.84)} L${point(px+size)},${point(py+size*.84)} Z`
      );
    } else if (isSale) {
      eventPaths.sale.push(
        `M${point(px)},${point(py+size)} L${point(px-size)},${point(py-size*.84)} L${point(px+size)},${point(py-size*.84)} Z`
      );
    } else {
      eventPaths.other.push(
        `M${point(px-size)},${point(py)} A${size},${size} 0 1 0 ${point(px+size)},${point(py)} A${size},${size} 0 1 0 ${point(px-size)},${point(py)} Z`
      );
    }
  });
  const seriesStyle = {
    purchase: ["var(--gn)", "var(--gn)"],
    sale: ["#c65c4a", "#c65c4a"],
    other: ["#898b87", "#898b87"],
  };
  const markers = Object.entries(eventPaths)
    .filter(([, paths]) => paths.length)
    .map(([category, paths]) => {
      const [fill, stroke] = seriesStyle[category];
      return `<path class="chart-event-series chart-event-${category}" data-category="${category}" data-event-count="${paths.length}" d="${paths.join(" ")}" fill="${fill}" stroke="${stroke}" aria-hidden="true" focusable="false"/>`;
    }).join("");
  const dates = [...new Set(datedRows.map(item => item.transactionDate))].sort();
  const labelDates = dates.length <= 7
    ? dates
    : [...new Set(Array.from({ length: 7 }, (_, index) => (
        dates[Math.round(index * (dates.length - 1) / 6)]
      )))];
  const labels = labelDates.map(date =>
    `<text class="chart-axis" x="${x(date)}" y="${height-5}" text-anchor="middle">${esc(displayDate(date))}</text>`
  ).join("");
  const empty = datedRows.length
    ? ""
    : `<text class="chart-axis" x="${width / 2}" y="${height / 2}" text-anchor="middle">No transactions match these filters.</text>`;
  return `<section class="insider-card" aria-labelledby="insiderChartTitle">
    <div class="insider-chart-head"><h2 class="insider-chart-title" id="insiderChartTitle">Insider Transaction Timeline</h2><div class="range-controls" aria-label="Chart range">${[["90d","90D"],["6m","6M"],["1y","1Y"],["2y","2Y"],["5y","5Y"],["all","All"]].map(([value,label]) => `<button class="range-button ${state.range === value ? "active" : ""}" aria-pressed="${state.range === value}" onclick="setInsiderQuery({range:'${value}'})">${label}</button>`).join("")}</div></div>
    <div class="chart-legend"><span class="legend-purchase">▲ Purchase (P)</span><span class="legend-sale">▼ Sale (S)</span><span class="legend-other">● Other</span></div>
    <p class="drawer-note">Daily share-price history is not integrated; markers use only prices reported in each SEC transaction.</p>
    <p class="sr-only" style="position:absolute;left:-10000px">The transaction table below is the canonical text and filing-detail alternative for this transaction timeline.</p>
    <div class="insider-chart-wrap"><svg id="insiderPriceChart" viewBox="0 0 ${width} ${height}" role="img" data-event-count="${datedRows.length}" aria-label="Insider transaction timeline showing ${datedRows.length} filtered transactions; use the table below for transaction text and filing details"><line class="chart-grid" x1="${pad.left}" y1="66" x2="${width-pad.right}" y2="66"/>${markers}${labels}${empty}</svg></div>
  </section>`;
}

function insiderChartMarkup(fixture, state, rows) {
  const allSeries = fixture.priceSeries || [];
  if (currentInsiderPayloadMode === "live" && !allSeries.length) {
    return insiderTransactionTimelineMarkup(fixture, state, rows);
  }
  const rangeMonths = { "90d": 3, "6m": 6, "1y": 12, "2y": 24, "5y": 60, all: 9999 }[state.range];
  const endDate = allSeries.at(-1)?.date || state.end;
  const end = new Date(`${endDate}T00:00:00Z`);
  const start = new Date(end);
  start.setUTCMonth(start.getUTCMonth() - rangeMonths);
  const series = allSeries.filter(point => state.range === "all" || new Date(`${point.date}T00:00:00Z`) >= start);
  const width = 1030;
  const height = 158;
  const pad = { left: 38, right: 32, top: 12, bottom: 24 };
  const closes = series.map(point => Number(point.close)).filter(Number.isFinite);
  const min = Math.min(...closes, 5);
  const max = Math.max(...closes, 25);
  const dateValue = value => new Date(`${value}T00:00:00Z`).getTime();
  const minDate = dateValue(series[0]?.date || state.start);
  const maxDate = dateValue(series.at(-1)?.date || state.end);
  const x = date => pad.left + ((dateValue(date) - minDate) / Math.max(1, maxDate - minDate)) * (width - pad.left - pad.right);
  const y = value => pad.top + ((max - Number(value)) / Math.max(1, max - min)) * (height - pad.top - pad.bottom);
  const line = series.map((point, index) => `${index ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.close).toFixed(1)}`).join(" ");
  const closeForDate = date => {
    let candidate = series[0];
    for (const point of series) if (point.date <= date) candidate = point;
    return candidate?.close || String((min + max) / 2);
  };
  const markers = rows.map((item, index) => {
    const chartEvent = (fixture.chartEvents || []).find(event => event.displayGroupKey === item.displayGroupKey);
    const px = Math.max(pad.left, Math.min(width - pad.right, x(item.transactionDate))) + ((index % 3) - 1) * 3;
    const py = y(chartEvent?.plotPrice || closeForDate(item.transactionDate));
    const isPurchase = item.transactionCode === "P";
    const isPlanSale = item.transactionCode === "S" && item.planStatus === "filing_marked";
    const isOther = !["P", "S"].includes(item.transactionCode);
    const numericValue = Number(item.value);
    const markerSize = Number.isFinite(numericValue) && numericValue !== 0
      ? Math.max(5, Math.min(9, 5 + Math.log10(Math.abs(numericValue)) - 5))
      : 5;
    const size = markerSize.toFixed(1);
    const label = `${item.ownerGroup?.displayName || "Insider"}, ${item.transactionLabel}, ${item.transactionDate}, ${item.shares || "unknown"} shares, ${item.priceDisplay || "price not reported"}, ${item.valueDisplay || "value unavailable"}, Form ${item.formType}`;
    const accession = safeInsiderAccession(item.accessionNumber);
    const interaction = accession
      ? `tabindex="0" role="button" data-insider-accession="${esc(accession)}"`
      : "";
    const titleAction = accession ? "Click for details." : "Filing detail unavailable.";
    if (isOther) return `<circle class="chart-marker other" cx="${px}" cy="${py}" r="${size}" fill="#898b87" stroke="#898b87" aria-label="${esc(label)}" ${interaction}><title>${esc(label)}. ${titleAction}</title></circle>`;
    if (isPurchase) return `<polygon class="chart-marker" points="${px},${py-markerSize} ${px-markerSize},${py+markerSize*.84} ${px+markerSize},${py+markerSize*.84}" fill="var(--gn)" stroke="var(--gn)" aria-label="${esc(label)}" ${interaction}><title>${esc(label)}. ${titleAction}</title></polygon>`;
    if (isPlanSale) return `<polygon class="chart-marker" points="${px},${py+markerSize} ${px-markerSize},${py-markerSize*.84} ${px+markerSize},${py-markerSize*.84}" fill="var(--cd)" stroke="#c65c4a" aria-label="${esc(label)}" ${interaction}><title>${esc(label)}. Filing marked Rule 10b5-1. ${titleAction}</title></polygon>`;
    return `<polygon class="chart-marker" points="${px},${py+markerSize} ${px-markerSize},${py-markerSize*.84} ${px+markerSize},${py-markerSize*.84}" fill="#c65c4a" stroke="#c65c4a" aria-label="${esc(label)}" ${interaction}><title>${esc(label)}. ${titleAction}</title></polygon>`;
  }).join("");
  const grids = [0, 1, 2, 3].map(index => {
    const gy = pad.top + index * ((height - pad.top - pad.bottom) / 3);
    const value = max - index * ((max - min) / 3);
    return `<line class="chart-grid" x1="${pad.left}" y1="${gy}" x2="${width-pad.right}" y2="${gy}"/><text class="chart-axis" x="2" y="${gy+3}">$${value.toFixed(0)}</text>`;
  }).join("");
  const labels = series.filter((_, index) => index % Math.max(1, Math.floor(series.length / 7)) === 0).map(point => `<text class="chart-axis" x="${x(point.date)}" y="${height-4}" text-anchor="middle">${esc(displayDate(point.date).replace(/ \d{1,2},/, ""))}</text>`).join("");
  return `<section class="insider-card" aria-labelledby="insiderChartTitle">
    <div class="insider-chart-head"><h2 class="insider-chart-title" id="insiderChartTitle">Share Price &amp; Insider Transactions</h2><div class="range-controls" aria-label="Chart range">${[["6m","6M"],["1y","1Y"],["2y","2Y"],["5y","5Y"],["all","All"]].map(([value,label]) => `<button class="range-button ${state.range === value ? "active" : ""}" aria-pressed="${state.range === value}" onclick="setInsiderQuery({range:'${value}'})">${label}</button>`).join("")}</div></div>
    <div class="chart-legend"><span><i class="legend-price"></i> Price</span><span class="legend-purchase">▲ Purchase (P)</span><span class="legend-sale">▼ Sale (S)</span><span class="legend-sale">▽ Sale (10b5-1)</span><span class="legend-other">● Other</span></div>
    <p class="sr-only" style="position:absolute;left:-10000px">The transaction table below is the canonical text alternative for this price chart.</p>
    <div class="insider-chart-wrap"><svg id="insiderPriceChart" viewBox="0 0 ${width} ${height}" role="group" aria-label="Share price and insider transaction chart">${grids}<path class="chart-price-line" d="${line}"/>${markers}${labels}</svg></div>
  </section>`;
}

    <button class="filter-button ${state.transactionScope === "ps" ? "active" : ""}" aria-pressed="${state.transactionScope === "ps"}" onclick="setInsiderQuery({transactionScope:'ps'})">P/S Only</button>

function insiderTransactionPaginationMarkup(pagination) {
  if (!pagination || pagination.total <= pagination.pageSize) return "";
  const firstItem = pagination.total ? pagination.start + 1 : 0;
  return `<nav class="insider-pagination" aria-label="Insider transaction pages">
    <button type="button" aria-label="Previous page" ${pagination.page <= 1 ? "disabled" : ""} onclick="setInsiderQuery({page:${pagination.page - 1}})">Previous</button>
    <span class="insider-pagination-status" aria-live="polite">${firstItem}–${pagination.end} of ${pagination.total}</span>
    <button type="button" aria-label="Next page" ${pagination.page >= pagination.pageCount ? "disabled" : ""} onclick="setInsiderQuery({page:${pagination.page + 1}})">Next</button>
  </nav>`;
}

function insiderTransactionTableMarkup(rows, state, pagination) {
  const sortHeader = (key, label, align = "right") => {
    const ariaSort = state.sort === key
      ? (state.order === "asc" ? "ascending" : "descending")
      : "none";
    return `<th scope="col" aria-sort="${ariaSort}" style="text-align:${align}"><button type="button" class="table-sort" aria-label="Sort by ${esc(label)}" onclick="setInsiderQuery({sort:'${key}',order:'${state.sort === key && state.order === "desc" ? "asc" : "desc"}'})">${esc(label)}${state.sort === key ? (state.order === "desc" ? " ↓" : " ↑") : ""}</button></th>`;
  };
  const body = rows.length ? rows.map(item => {
    const sourceUrl = safeSecDocumentUrl(item.secDocumentUrl);
    const source = sourceUrl
      ? `<a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer" aria-label="Open SEC Form ${esc(item.formType)} filed ${esc(displayDate(item.filingDate))}">${esc(displayDate(item.filingDate))} ↗</a>`
      : `<span title="SEC source URL unavailable">${esc(displayDate(item.filingDate))}</span>`;
    const accession = safeInsiderAccession(item.accessionNumber);
    const detailControl = accession
      ? `<button type="button" class="filing-detail-button" data-insider-accession="${esc(accession)}" aria-label="Open ${esc(item.ownerGroup?.displayName)} ${esc(item.transactionLabel)} filing detail">Details ›</button>`
      : `<span class="drawer-note">Detail unavailable</span>`;
    return `<tr class="insider-row">
    <td>${esc(displayDate(item.transactionDate))}</td>
    <td><div class="insider-name">${esc(item.ownerGroup?.displayName || "—")}</div><div class="insider-role">${esc(item.ownerGroup?.primaryTitle || "—")}${item.ownerGroup?.roles?.length ? ` · ${esc(item.ownerGroup.roles.join(" / "))}` : ""}</div></td>
    <td><span class="txn-badge ${esc(item.normalizedCategory)}">${esc(item.transactionLabel)}</span>${item.planStatus === "filing_marked" ? `<span class="plan-chip" title="Filing marked Rule 10b5-1">10b5-1</span>` : ""}</td>
    <td style="text-align:right">${esc(exactWholeDisplay(item.shares))}</td>
    <td style="text-align:right" title="${item.pricePerShare == null ? "Price not reported" : (item.priceIsWeightedAverage ? "Reported weighted-average price" : "Reported price")}">${esc(item.priceDisplay || "—")}${item.priceIsWeightedAverage ? " ⓘ" : ""}</td>
    <td style="text-align:right" title="${esc(item.valueMethod === "calculated_shares_times_price" ? "Calculated from reported shares and reported price per share." : item.valueMethod || "Value unavailable")}">${esc(item.valueDisplay || "—")}</td>
    <td style="text-align:right" title="${esc(item.directIndirectOwnership === "I" ? `Indirect ownership${item.natureOfOwnership ? `: ${item.natureOfOwnership}` : ""}` : "Direct ownership")}">${esc(exactWholeDisplay(item.postTransactionShares))}</td>
    <td class="${String(item.percentChange || "").startsWith("-") ? "negative" : "positive"}" style="text-align:right">${esc(item.percentChangeDisplay || "—")}</td>
    <td class="filing-cell"><strong>Form ${esc(item.formType)}</strong>${source}${detailControl}</td>
  </tr>`;
  }).join("") : `<tr><td class="insider-empty" colspan="9"><strong>No transactions match these filters.</strong><br>Clear the insider search or broaden the owner and transaction filters.</td></tr>`;
  return `<section class="insider-card" aria-label="Insider transactions">${insiderFilterMarkup(state)}<div class="tbl-wrap"><table id="insiderTransactionTable"><thead><tr>
    ${sortHeader("tradeDate", "Date (Trade)", "left")}<th scope="col" style="text-align:left">Insider / Role</th><th scope="col" style="text-align:left">Transaction</th>${sortHeader("shares", "Shares")}<th scope="col" style="text-align:right">Price</th>${sortHeader("value", "Value")}${sortHeader("holdingsAfter", "Holdings After")}${sortHeader("percentChange", "% Change")}<th scope="col" style="text-align:left">Filing</th>
  </tr></thead><tbody>${body}</tbody></table></div>${insiderTransactionPaginationMarkup(pagination)}</section>`;
}

function wireInsiderFilingTriggers() {
  for (const trigger of app().querySelectorAll("[data-insider-accession]")) {
    const accession = safeInsiderAccession(trigger.dataset.insiderAccession);
    if (!accession) continue;
    trigger.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      openInsiderFiling(accession, trigger);
    });
    if (trigger.matches("button, a[href]")) continue;
    trigger.addEventListener("keydown", event => {
      if (!["Enter", " "].includes(event.key)) return;
      event.preventDefault();
      openInsiderFiling(accession, trigger);
    });
  }
}

    <div class="insider-rail-section"><div class="insider-rail-head"><span>Rule 10b5-1 Activity <small>${esc(windowLabel)}</small></span><button class="summary-action" onclick="openInsiderMethodology()">View all</button></div><div class="plan-row"><span>Plan-Marked Sales</span><strong>${esc(sidebar.rule10b51?.planMarkedSalesDisplayValue || "—")}</strong></div><div class="plan-row"><span>Distinct Insiders</span><strong>${esc(sidebar.rule10b51?.distinctOwnerGroupCount ?? "—")}</strong></div><div class="plan-row"><span>Latest Plan Adoption</span><strong>${esc(displayDate(sidebar.rule10b51?.latestPlanAdoptionDate) || "—")}</strong></div></div>
  </section></aside>`;
}

function insiderFooterMarkup(fixture) {
  const freshness = fixture.dataFreshness || {};

    return `<footer class="insider-footer"><span>Published from validated SEC Forms 3, 4, and 5. Reporting-owner display is limited to name as filed and company relationship/title.</span><span>Published: ${esc(updated)} &nbsp;ⓘ<span class="sr-only"> Latest successful SEC sync ${esc(freshness.latestSuccessfulSecSyncAt || "unknown")}</span></span></footer>`;
  }
  return `<footer class="insider-footer"><span>Fixture preview sourced only from the bundled illustrative JSON. No names, values, or dates are real APGE filing evidence.</span><span>Fixture updated: ${esc(updated)} &nbsp;ⓘ<span class="sr-only"> Latest fixture price date ${esc(freshness.latestPriceDate || "unknown")}</span></span></footer>`;

function renderInsiderActivity(fixture, stockId) {
  const state = insiderQueryState(fixture);
  const rows = filteredInsiderTransactions(fixture, state);
  const pagination = insiderTransactionPage(fixture, rows, state);
  if (currentInsiderPayloadMode === "live") {
    canonicalizeInsiderPageQuery(pagination.page);
  }
  const projection = filteredInsiderProjection(fixture, state, rows);
  app().innerHTML = `<div class="insider-shell">${insiderIdentityMarkup(fixture, stockId, "insiders")}<div class="insider-layout"><main class="insider-main">${insiderSummaryMarkup(fixture, stockId, projection.summary).replace(insiderSecurityTabs(stockId, "insiders"), "")}${insiderChartMarkup(fixture, state, rows)}${insiderTransactionTableMarkup(pagination.items, state, pagination)}</main>${insiderSummaryRailMarkup(fixture, stockId, projection.sidebar)}</div>${insiderFooterMarkup(fixture)}</div><div id="insiderDrawerHost"></div>`;
  wireDataActions();
  wireInsiderFilingTriggers();
  if (state.filing) queueMicrotask(() => openInsiderFiling(state.filing));
}

function reportingOwnersFromFixture(fixture) {
  const transactions = fixture.transactions?.items || [];
  const map = new Map();
  for (const item of transactions) {
    const key = item.ownerGroup?.key || item.ownerGroup?.displayName;
    if (!key) continue;
    const previous = map.get(key);
    if (!previous || item.filingDate > previous.filingDate) map.set(key, item);
  }
  for (const item of [
    ...(fixture.sidebar?.latestReportedHoldings?.officersAndDirectors || []),
    ...(fixture.sidebar?.latestReportedHoldings?.tenPercentOwnersAndEntities || []),
  ]) {
    if (![...map.values()].some(row => row.ownerGroup?.displayName === item.displayName)) {
      map.set(item.displayName, { ownerGroup: { displayName: item.displayName, primaryTitle: item.roleLabel, roles: [item.roleLabel] }, filingDate: null, postTransactionShares: item.shares, valueDisplay: "—" });
    }
  }
  const buyers = new Map(
    (fixture.sidebar?.topBuyers || []).map(item => [item.displayName, item])
  );
  const sellers = new Map(
    (fixture.sidebar?.topSellers || []).map(item => [item.displayName, item])
  );
  return [...map.values()].map(item => {
    const displayName = item.ownerGroup?.displayName || "";
    const buyer = buyers.get(displayName);
    const seller = sellers.get(displayName);
    return {
      ...item,
      reportingPurchaseDisplay: buyer?.displayValue || "—",
      reportingSaleDisplay: seller?.displayValue || "—",
      reportingPlanMarkedSalePercentage:
        seller?.planMarkedKnownValuePercentage ?? null,
    };
  });
}

function renderReportingInsiders(fixture, stockId) {
  const owners = reportingOwnersFromFixture(fixture);
  const tenPercentCount = owners.filter(item => (item.ownerGroup?.roles || []).some(role => String(role).includes("10%") || role === "TenPercentOwner")).length;

async function loadInsiderFixture(stock, stockId, view, requestToken) {
  if (requestToken !== insiderViewRequestToken) return;
  currentInsiderPayloadMode = "fixture";
  currentLiveInsiderPayload = null;
  const path = insiderFixturePathForStock(stockId, stock);
  if (!path) {
    renderInsiderError(stock, stockId, view, "The Phase 1 fixture preview is available only for the APGE security identity.");
    return;
  }
  renderInsiderLoading(stock, stockId, view);
  try {
    if (!insiderFixtureCache) {
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const fixture = await response.json();
      if (!fixture?._fixtureNotice || fixture.security?.cusip !== "03770N101" || !Array.isArray(fixture.transactions?.items)) throw new Error("Fixture contract is invalid");
      if (requestToken !== insiderViewRequestToken) return;
      insiderFixtureCache = fixture;
    }
    if (requestToken !== insiderViewRequestToken) return;
    currentInsiderFixture = insiderFixtureCache;
    currentInsiderStock = stock;
    currentInsiderStockId = stockId;
    currentInsiderView = view;
    renderCurrentInsiderView();
  } catch (error) {
    if (requestToken !== insiderViewRequestToken) return;
    console.error("insider fixture fetch failed:", error);
    renderInsiderError(stock, stockId, view, "The illustrative fixture file is missing or unreachable. No live filing data was requested.");
  }
}

async function loadLiveInsiderView(stock, stockId, view, requestToken) {
  if (requestToken !== insiderViewRequestToken) return;
  currentInsiderPayloadMode = "live";
  renderInsiderLoading(stock, stockId, view);
  try {
    const payload = await loadLiveInsiderSecurityPayload(stockId);
    if (requestToken !== insiderViewRequestToken) return;
    if (payload === null) {
      currentInsiderFixture = null;
      currentLiveInsiderPayload = null;
      currentInsiderStock = stock;
      currentInsiderStockId = stockId;
      currentInsiderView = view;
      renderInsiderEmpty(stock, stockId, view);
      return;
    }
    currentLiveInsiderPayload = payload;
    currentInsiderFixture = liveInsiderPresentationPayload(payload);
    currentInsiderStock = stock;
    currentInsiderStockId = stockId;
    currentInsiderView = view;
    renderCurrentInsiderView();
  } catch (error) {
    if (requestToken !== insiderViewRequestToken) return;
    console.error("published insider activity fetch failed:", error);
    currentInsiderFixture = null;
    currentLiveInsiderPayload = null;
    renderInsiderError(
      stock,
      stockId,
      view,
      "Validated public insider activity is temporarily unavailable."
    );
  }
}

function drawerKeydown(event) {
  if (event.key === "Escape") {
    event.preventDefault();
    closeInsiderDrawer();
    return;
  }
  if (event.key !== "Tab") return;
  const drawer = $("insiderDrawer");
  if (!drawer) return;
  const focusable = [...drawer.querySelectorAll('button,a[href],input,[tabindex]:not([tabindex="-1"])')].filter(element => !element.disabled);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable.at(-1);
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}
